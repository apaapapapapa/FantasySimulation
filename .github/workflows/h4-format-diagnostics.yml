name: H4 formatter diagnostics

on:
  push:
    branches: [feat/h4-secret-scan]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6 # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Format only the two requested security scripts
        run: vp fmt scripts/security/common.ts scripts/security/secrets.ts
      - name: Preserve formatter output for review without pushing changes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h4-formatted-scripts-${{ github.sha }}
          path: |
            scripts/security/common.ts
            scripts/security/secrets.ts
          if-no-files-found: error
          retention-days: 1
