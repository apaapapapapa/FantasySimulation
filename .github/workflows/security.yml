name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '45 19 * * 1'

permissions:
  contents: read

env:
  H4_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  H4_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure temporary receipt directory
        run: echo "H4_REPORT_DIR=$RUNNER_TEMP/h4-reports" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gitleaks"
          mkdir -p "$directory"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$directory/$archive"
          echo "$GITLEAKS_SHA256  $directory/$archive" | sha256sum --check --status
          tar -xzf "$directory/$archive" -C "$directory" gitleaks
          echo "$directory" >> "$GITHUB_PATH"
      - name: Policy regression tests
        run: node --test scripts/security/security.test.ts
      - name: Markdown and deleted-history canaries
        run: node scripts/security/secrets.ts --self-test
      - name: Scan full history and working tree
        run: node scripts/security/secrets.ts
      - name: Upload sanitized receipts only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h4-reports/*.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL and severity policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Configure temporary receipt directory
        run: echo "H4_REPORT_DIR=$RUNNER_TEMP/h4-reports" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: Plan CodeQL scope from the actual merge diff
        id: scope
        run: node scripts/ci/plan.ts "$RUNNER_TEMP/codeql-plan.json"
      - name: Record the verified planned CodeQL exclusion (wording-only or PR fast lane)
        if: steps.scope.outputs.codeql == 'false'
        run: node scripts/security/codeql-scope.ts
      - name: Initialize JavaScript and TypeScript analysis
        if: steps.scope.outputs.codeql == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/config.yml
          # An empty value uses the standard PR query suite.
          queries: ${{ github.event_name != 'pull_request' && 'security-extended' || '' }}
      - name: Analyze the complete workspace
        if: steps.scope.outputs.codeql == 'true'
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
          category: /language:javascript-typescript
      - name: Enforce high and critical policy on all current results
        if: steps.scope.outputs.codeql == 'true'
        run: node scripts/security/codeql.ts "$RUNNER_TEMP/codeql-results"
      - name: Publish analysis even when the severity policy blocks it
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:javascript-typescript
          wait-for-processing: true
      - name: Upload sanitized policy receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h4-reports/*.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Configure temporary receipt directory
        run: echo "H4_REPORT_DIR=$RUNNER_TEMP/h4-reports" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: Audit the pinned lockfile including dev and transitive dependencies
        run: node scripts/security/audit.ts
      - name: Upload sanitized audit receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h4-reports/*.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: security-gate
    needs: [secrets, codeql, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every planned security job to succeed
        env:
          SECRET_RESULT: ${{ needs.secrets.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$SECRET_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$AUDIT_RESULT" = success
