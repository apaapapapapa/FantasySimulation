name: H4 delivery evidence probe
on:
  push:
    branches: [test/h4-delivery-evidence]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 496e30f8d0bef1a59ea5c587da41209559e2bacc
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Collect actual PR and main evidence without writes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vp exec node scripts/harness.ts github-snapshot apaapapapapa/FantasySimulation 46 .generated/harness/pr-46
          vp exec node scripts/harness.ts github-snapshot apaapapapapa/FantasySimulation 47 .generated/harness/pr-47
      - name: Retain collector output and exact read-only assessor sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h4-delivery-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .generated/harness/pr-46/
            .generated/harness/pr-47/
            scripts/harness/report.ts
            scripts/harness/delivery.ts
            scripts/harness/files.ts
            scripts/ci/plan.ts
            scripts/security/evidence.ts
            scripts/security/common.ts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
