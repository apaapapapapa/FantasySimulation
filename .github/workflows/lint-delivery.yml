          -it('rejects direct, computed and aliased implicit randomness and environment access', () => {
          -  for (const [code, findings] of cases([
          +it.each(
          +  cases([
               'Math.random();',
               "Math['random']();",
               'const {random}=Math; random();',
          @@ -43,8 +43,9 @@ it('rejects direct, computed and aliased implicit randomness and environment acc
               'Atomics.wait(a, 0, 0);',
               'setTimeout(() => {}, 0);',
               "new Function('return Date.now()')();",
          -  ]))
          -    expect(findings, code).not.toEqual([]);
          +  ]),
          +)('rejects implicit randomness and environment access: %s', (_code, findings) => {
          +  expect(findings).not.toEqual([]);
           });
           
           it('allows deterministic math, explicit local inputs, property names and pure hash aliases', () => {
          @@ -61,8 +62,8 @@ it('allows deterministic math, explicit local inputs, property names and pure ha
             ).toEqual([]);
           });
           
          -it('limits the crypto exception to static named createHash imports', () => {
          -  for (const [code, findings] of cases([
          +it.each(
          +  cases([
               "import {randomBytes} from 'node:crypto';",
               "import * as crypto from 'node:crypto';",
               "import crypto from 'node:crypto';",
          @@ -71,31 +72,29 @@ it('limits the crypto exception to static named createHash imports', () => {
               "export * from 'node:crypto';",
               "const c=await import('node:crypto');",
               "const c=require('node:crypto');",
          -  ]))
          -    expect(
          -      findings.some((f) => f.rule === 'pure-hash-only'),
          -      code,
          -    ).toBe(true);
          +  ]),
          +)('limits the crypto exception to static named createHash imports: %s', (_code, findings) => {
          +  expect(findings.some((f) => f.rule === 'pure-hash-only')).toBe(true);
           });
           
          -it('rejects network, database and unreviewed SDK imports at the engine boundary', () => {
          -  const modules = [
          -    'node:fs',
          -    'node:http',
          -    'node:sqlite',
          -    'crypto',
          -    'undici',
          -    'better-sqlite3',
          -    '@fantasy/domain-unsafe',
          -  ];
          -  for (const [code, findings] of cases(
          -    modules.map((module) => `import * as imported from '${module}';`),
          -  ))
          -    expect(
          -      findings.some((f) => f.rule === 'engine-dependency-policy'),
          -      code,
          -    ).toBe(true);
          -});
          +it.each(
          +  cases(
          +    [
          +      'node:fs',
          +      'node:http',
          +      'node:sqlite',
          +      'crypto',
          +      'undici',
          +      'better-sqlite3',
          +      '@fantasy/domain-unsafe',
          +    ].map((module) => `import * as imported from '${module}';`),
          +  ),
          +)(
          +  'rejects network, database and unreviewed SDK imports at the engine boundary: %s',
          +  (_code, findings) => {
          +    expect(findings.some((f) => f.rule === 'engine-dependency-policy')).toBe(true);
          +  },
          +);
           
           it('rejects unsupported TypeScript module variants instead of omitting their execution', () => {
             expect(
          diff --git a/scripts/security/issue-completion-markdown.test.ts b/scripts/security/issue-completion-markdown.test.ts
          index c060f5e..f124bc4 100644
          --- a/scripts/security/issue-completion-markdown.test.ts
          +++ b/scripts/security/issue-completion-markdown.test.ts
          @@ -57,3 +57,21 @@ await test('ambiguous comment-prefixed tasks fail closed instead of editing the
             );
             assert.throws(() => issueTasks('<!-- unclosed'), /UNTERMINATED_ISSUE_MARKUP/);
           });
          +
          +await test('completion evidence escapes Markdown and HTML without creating extra lines', () => {
          +  const raw = '&<>@`[]*_\r\nnext';
          +  const escaped = '&#38;&#60;&#62;&#64;&#96;&#91;&#93;&#42;&#95; next';
          +  const result = completedBody(
          +    {
          +      ...plan,
          +      summary: raw,
          +      acceptance: [{ task: raw, evidence: raw }],
          +    },
          +    'No checklist.',
          +    'a'.repeat(40),
          +    100,
          +  );
          +  assert.ok(result.includes(`\n${escaped}\n`));
          +  assert.ok(result.includes(`- [x] ${escaped} — ${escaped}\n`));
          +  assert.ok(!result.includes(raw));
          +});
          PATCH
          test "$(git rev-parse HEAD)" = 4fd45b99deb780482db3b12e7bcaafd12e642a70
          git apply --check "$RUNNER_TEMP/lint.patch"
          git apply --index "$RUNNER_TEMP/lint.patch"
          git diff --cached --check
          test "$(git write-tree)" = 277684374a58714dde0108da7a8265a541d5fae5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: resolve all 13 lint warnings without weakening checks'
      - name: Canonical verification of the clean candidate
        shell: bash
        run: env -u GITHUB_SHA -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH vp exec node scripts/harness.ts source .generated/harness/lint-source
      - name: Publish only the reviewed candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^{tree})" = 277684374a58714dde0108da7a8265a541d5fae5
          test -z "$(git status --porcelain)"
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/chore/lint-zero-warnings
          git rev-parse HEAD > .generated/harness/lint-source/candidate-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lint-candidate-evidence
          path: .generated/harness/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
