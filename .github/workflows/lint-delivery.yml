name: Lint delivery evidence
on:
  push:
    branches: [test/lint-delivery-20260923]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4fd45b99deb780482db3b12e7bcaafd12e642a70
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Apply the reviewed seven-file patch and require its exact tree
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lint.patch" <<'PATCH'
          diff --git a/apps/api/src/app.test.ts b/apps/api/src/app.test.ts
          index cd0da81..1082963 100644
