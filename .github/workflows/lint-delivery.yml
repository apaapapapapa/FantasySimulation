          +    expect(paths.length).toBeGreaterThan(0);
          +    for (const path of paths) {
          +      expect(path.segments.length).toBeGreaterThan(0);
          +      expect(path.segments[0]!.from).toBe(0);
          +      expect(path.segments.at(-1)!.to).toBe(1);
          +      for (let i = 1; i < path.segments.length; i++)
          +        expect(path.segments[i]!.start).toEqual(path.segments[i - 1]!.end);
               }
               const log = events(run.records);
          +    expect(log.length).toBeGreaterThan(0);
          +    expect(log.some((event) => event.parentEventId !== null)).toBe(true);
               expect(log.map((e) => e.sequence)).toEqual(log.map((_, i) => i));
               const seen = new Set<string>();
               for (const event of log) {
          -      if (event.parentEventId) expect(seen.has(event.parentEventId)).toBe(true);
          -      for (const cause of event.causes) expect(seen.has(cause)).toBe(true);
          +      const parents = event.parentEventId === null ? [] : [event.parentEventId];
          +      for (const cause of [...parents, ...event.causes]) expect(seen.has(cause)).toBe(true);
                 seen.add(event.id);
               }
               expect(input).toEqual(copy);
          diff --git a/scripts/harness/files.test.ts b/scripts/harness/files.test.ts
          index a258dfc..3a93819 100644
          --- a/scripts/harness/files.test.ts
          +++ b/scripts/harness/files.test.ts
          @@ -11,8 +11,8 @@ it('accepts an exact byte limit and rejects excess, invalid JSON and non-files',
               expect(readBoundedJson(file, 7)).toEqual({ n: 1 });
               expect(() => readBoundedJson(file, 6)).toThrow(/oversized/);
               writeFileSync(file, 'invalid');
          -    expect(() => readBoundedJson(file, 7)).toThrow();
          -    expect(() => readBoundedJson(dir)).toThrow();
          +    expect(() => readBoundedJson(file, 7)).toThrow(SyntaxError);
          +    expect(() => readBoundedJson(dir)).toThrow(/Invalid or oversized input|EISDIR/);
               expect(() => readBoundedJson(file, 0)).toThrow(/budget/);
             } finally {
               rmSync(dir, { recursive: true, force: true });
          diff --git a/scripts/harness/issue-completion.ts b/scripts/harness/issue-completion.ts
          index 3b2f6bf..4979387 100644
          --- a/scripts/harness/issue-completion.ts
          +++ b/scripts/harness/issue-completion.ts
          @@ -206,7 +206,7 @@ export function issueTasks(body: string): { line: number; task: string }[] {
           
           function markdown(value: string): string {
             return value
          -    .replace(/[&<>@`\[\]*_]/g, (char) => `&#${char.charCodeAt(0)};`)
          +    .replace(/[&<>@`[\]*_]/g, (char) => `&#${char.charCodeAt(0)};`)
               .replace(/\r?\n/g, ' ');
           }
           
          diff --git a/scripts/quality/determinism.test.ts b/scripts/quality/determinism.test.ts
          index a1251b7..b982f4d 100644
          --- a/scripts/quality/determinism.test.ts
          +++ b/scripts/quality/determinism.test.ts
          @@ -18,8 +18,8 @@ function cases(codes: string[]) {
