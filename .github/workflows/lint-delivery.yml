name: Lint delivery evidence
on:
  push:
    branches: [test/lint-delivery-20260923]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8411a1aceeec0253403a5e669f4d28f30c09d6fd
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Require the exact main CI run to finish successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 180 gh run watch 35773591490 --repo apaapapapapa/FantasySimulation --exit-status --interval 10
      - name: Collect authoritative post-merge delivery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp exec node scripts/harness.ts github-snapshot apaapapapapa/FantasySimulation 49 .generated/harness/pr49-after-merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lint-main-delivery
          path: .generated/harness/pr49-after-merge/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
