name: Issue 81 acceptance scope and plan
on:
  push:
    branches: [ops/81-acceptance-20260925]
    paths: [.github/workflows/finish81.yml]
permissions: {}
jobs:
  plan:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3a81e83358b338daf40483407a0c5c574f95830f
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Record user-approved scope and observed billing
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 0
          script: |
            const assert=require('node:assert/strict');
            const args={owner:'apaapapapapa',repo:'FantasySimulation',issue_number:81};
            const before=(await github.rest.issues.get(args)).data;
            assert.equal(before.state,'open');
            assert.equal(before.body,"## 位置付け\n\n親: #10（③）。関連: [ADR 0006](https://github.com/apaapapapapa/FantasySimulation/blob/main/docs/adr/0006-recorded-replay.md)（配信契約）、[ADR 0008][adr0008]（bundle）、#6（CI）、#5（証跡）、#8（依存・秘密情報の検査）。旧#10のR6・R7・A2・A4。\n\nユーザー決定（2026-09-24更新。公開先の選択は2026-09-23を維持）:\n\n- **ユーザーはスマホのChatGPTアプリからCodex等に指示し、自分のPCを一切使わない。ターミナル・ローカル`.env`の作成を要求しない。**\n- 画面はGitHub Pages、データはCloudflare R2に最初から置く。\n- 独自ドメインがないため、R2は非公開のままにし、読取専用のWorker（workers.dev）経由で配信する。r2.devは使わない。\n- 公開用の対戦計算・保存はGitHub ActionsのLinux runnerで行う。公開は成功したmainのCIを確認した上で明示的に手動起動する。Codexの開発・PRテストに本番キーは渡さない。\n- 対象bucket限定のR2資格情報は、GitHub Environment `r2-publication` のSecretsに保存する。従来の「ローカル`.env`のみ」「GitHub Secrets禁止」は、この保護されたEnvironment運用に置き換える。repository全体のSecrets、コード、チャット、ブラウザーへの保存はしない。\n- 費用: R2とWorkers Freeの無料枠内で運用する。公開コマンドは、設定した上限（既定は保存8GB）を超える公開を開始前に拒否する。超える見込みになったら、公開を止めて相談する。\n\n設定・配備の進捗は各コメントの実測記録を参照。5章と6章は受入完了までチェックしない。ユーザーの初期操作はスマホのWeb画面で完結させる。今回のクラウド運用への変更はPR #105で対応する。\n\n## 1. 公開layout（R2と実行環境内の確認で共通）\n\n```text\ncatalog/current.json            可変。最新の公開世代を指す（cacheは短期）\ncatalog/<catalogHash>.json      不変。公開中のsetの一覧と、1つ前の世代\nsets/<setHash>/set.json         不変。対戦条件、参加者、生成元source、行数、ページ数\nsets/<setHash>/<pageHash>.json   不変。試合一覧のページ（#80の行の形式）\nobjects/<objectHash>/...        不変。ADR 0008のbundle（receipt・manifest・chunk・checkpoint）\n```\n\n- 確定した名前・上限・checksum規則はADR 0008とdomainの公開schemaを正本とする。#79の静的adapterと#80の一覧は同じ形式を読む。\n- `current.json`以外は内容のhashで名前を付け、上書きしない。同じbundleは、複数のsetや世代から共有する。\n- 各ファイルについて、checksumの対象bytesを決める。gzipは圧縮bytesを対象にする。JSONは配信時に自動で圧縮・展開されることがあるため、展開後のbytesを対象にする。\n- 次の情報は公開しない: ローカルDB、`.work/`、下書き、内部の絶対パス、環境変数、認証情報。\n\n## 2. exportと公開コマンド（クラウドのNode実行環境）\n\n- 入力は、`batch check`で照合した計画・index・bundle rootとする。未完了の枠を含む計画をCLIで公開する場合は、行ごとの状態と未完了の数を表示し、完了した計画と区別する。今回のActions workflowは完了した計算のみを公開するが、CLIの未完了行の契約は変更しない。\n- まず実行環境内のdirectoryへexportし、R2への保存にも同じ出力を使う。任意の開発用ローカル確認は残してよいが、ユーザーPCは必要条件にしない。\n- R2への書込には`@aws-sdk/client-s3`を使い、独自の署名処理を作らない。認証情報は対象bucketだけに限定したObject Read & Writeのtokenとし、GitHub Environment `r2-publication`のSecretsへ保存する。公開stepだけに環境変数として渡す。repo内ファイル、Pages生成物、ブラウザー、ログ、チャット、Codexの開発環境には置かない。\n- 書込の順序: bundle（検証済み）→setのページ→`set.json`→`catalog/<hash>`→`catalog/current.json`。複数objectの書込を、1つの原子的な操作と見なさない。\n- 既存のobjectは内容を照合して再利用し、上書きしない。同じsimulationHashで結果やevent hashが異なる場合は、公開を止める。\n- `current.json`を更新する前に、読んだ世代と新しい世代が参照する前の世代が一致することを確認し、古い公開で新しい世代を巻き戻さない。workflow concurrencyで逐次公開し、conditional PUTも維持する。\n- 転送の件数・bytes・並列数、再試行の回数と期限に上限を置く。認証の失敗や不正な入力を再試行し続けない。通信の成功と、公開の確定を区別する。\n- 公開後、S3 APIで各objectの存在とサイズを確認する。あわせて、catalog・setと抽出したbundleをWorker経由で読み戻し、checksumを照合してから完了とする。公開作業でWorkerの1日のリクエスト上限を使い切らない。\n- viewerとの互換: データの生成元のsource SHAが、公開中のviewerのsource SHAと同じか、その祖先であることを確認してから`current.json`を更新する。viewerは`build.json`に、自身のSHAと対応する版を出す。\n- 保存量の上限: 公開前に保存量と書込回数の見込みを表示し、設定した上限（既定は保存8GB。R2の無料枠10GBに余裕を残す）を超える公開は開始前に拒否する。アカウント全体の利用量・課金確認も別途必要。\n- 削除は明示的なコマンドだけで行う。保持中の世代から参照されるobjectは削除しない。容量を空けるために自動で削除しない。\n\n## 3. 読取Worker（workers.dev）\n\n- GET・HEAD・OPTIONSだけを受け付ける。R2 bindingのgetとheadだけを使い、書込と一覧はしない。\n- keyを公開layoutの形式（prefixとhashの名前）に限定し、`..`、任意のURL、一覧の要求を拒否する。\n- Content-Typeは、`.json`をapplication/json、`.gz`をapplication/gzipとし、`Content-Encoding`を付けない（ADR 0006）。\n- Cache-Controlは、不変のobjectを長期（immutable）、`catalog/current.json`を短期にする。\n- CORSは、`https://apaapapapapa.github.io`（pathを含まないorigin）だけを許可する。CORSを認証の代わりにせず、公開してよいデータだけを置く。\n- 無料枠の上限（Error 1027）、404、その他のエラーを区別できるようにする。#79では「配信の上限」「公開終了」「破損」を分けて表示する。\n- 1試合を観戦するのに必要なリクエスト数を測定し、1日の上限で何試合を観戦できるかを記録する。\n- コードはrepoで管理し、fakeのR2 bindingで単体試験する。置き場所と依存（型定義・デプロイ用のツール）は、依存方向の検査に規則を追加してレビューする。デプロイは認可済みクラウド連携、または別途最小権限に制限した配備経路で明示的に行い、コードhashを記録する。ユーザーPCからの実行を要求しない。R2公開用キーとWorker配備権限は混同しない。\n\n## 4. GitHub Pages\n\n- `apps/web`を`base: '/FantasySimulation/'`でbuildする。hash routingを使い、asset・Web Worker・データのURLを確認する。独自ドメインを使う場合に備えて、baseを切り替えられるようにする。\n- データのbase URL（WorkerのURL）は、build時の公開設定とする（secretではない）。`<meta>`でCSPを設定し、接続先を自身とWorkerのoriginに限定する。\n- deployのworkflow: mainのCI（#6のci-gate）が成功したSHAだけをbuild・deployする。PRやforkからは公開しない。`pages: write`と`id-token: write`はdeployのjobだけに与える。固定のtoolchain（Vite+・pnpm・`.node-version`）を使い、公式サンプルのnpmや可変のNode版に置き換えない。semantic-releaseとは別の処理にする。\n- `build.json`（source SHA、対応する版）を配信する。\n- 過去のSHAを再デプロイしても、公開中のデータを読めることを確認する。\n- 最初のデプロイは、#79の初版が完成した後に行う。\n\n## 5. 外部設定（スマホのWeb画面または認可済みクラウド連携。完了するまでチェックしない）\n\n- [ ] R2のbucketを作成する（公開アクセスは無効のまま）。CloudflareのWorkersのプラン（Free/Paid）と課金の設定を確認して記録する\n- [ ] 対象bucketだけのObject Read & Writeキーを、GitHub Environment `r2-publication`の`R2_ACCESS_KEY_ID`・`R2_SECRET_ACCESS_KEY`へ登録する。Environmentはbranch `main`だけを許可し、変数`R2_ACCOUNT_ID`・`R2_PUBLICATION_ENABLED=true`を設定する。ローカル`.env`は不要\n- [ ] 読取WorkerをR2 binding付きでクラウドからデプロイし、URL・コードhashを記録する\n- [ ] 利用量と費用を確認する方法（通知等）を設定する\n- [ ] リポジトリのPagesの公開元を「GitHub Actions」にする\n\n## 6. 受入条件\n\n- [ ] ユーザーPCを使わず、GitHub Actionsで計算したバッチ結果をlayoutのとおりにR2へ保存し、Worker経由で読み戻して照合できる\n- [ ] APIを止めた状態で、Pagesの画面からWorker経由でデータを読み、試合一覧→選択→再生→直接URLの再読込が成立する。CIのE2Eでは、Workerの代わりに別originのローカル静的サーバーを使う。本番での確認は手動で行い、記録する\n- [ ] 新しいrunnerでの復元・再公開でも同じobjectを再利用し、hashが一貫する。過去のリンクが別の内容に変わらない\n- [ ] 公開途中の停止と再実行、既存objectとの不一致、古い世代での上書き、viewerと非互換のデータを、fakeのS3等を使ったfixtureで検証する。許可済みのbucketでの受入試験とは区別する\n- [ ] 公開データと生成物に、秘密情報、ローカルDB、絶対パスが含まれないことを検査する。PR/Codexの開発環境に本番Secretを渡さない\n- [ ] Workerが書込・一覧・形式外のkeyを拒否し、CORSが公開originだけを許可する\n- [ ] 上限を超える公開・復元を拒否する。実測の保存量・書込回数・リクエスト数・費用と、保持の方針をADRに記録する\n- [ ] PagesへのdeployとR2公開が、mainの合格したSHAからだけ行われる。R2公開は明示的な手動起動・既定dry-run・逐次実行で、Environmentの制限後にも最新attemptのCIを確認する\n- [ ] `vp run verify`、Linux CI、#5の証跡で確認する\n\n## 7. 小PR\n\n1. 公開layoutと、実行環境内directoryへのexport（#80の一覧ファイルの生成を含む）\n2. GitHub Pagesのdeployのworkflow（base、hash routing、`build.json`、CSP）。#79の初版の後に行う\n3. 読取Workerのコードと試験\n4. R2への公開コマンド（S3 client、順序、再利用、世代、上限、読み戻し）\n5. PC不要の運用方針・保護されたActions公開・保持世代の復元（PR #105）\n6. 外部設定の後の受入（実際のbucket・Worker・Pagesでの確認とADR）\n\n[adr0008]: https://github.com/apaapapapapa/FantasySimulation/blob/main/docs/adr/0008-headless-batch.md\n\n## 8. 先行PRの分割方針と共通契約案（2026-09-23の記録）\n\n本節の「ローカルdirectory」は実行環境内のfilesystemを指す。2026-09-24以降、ユーザーPCを要求する根拠にはしない。\n\nユーザー方針: **本Issueの小PR1と#12のE2E準備を分け、画面側に必要な共通型だけ先にレビューする。** G-07/G-08および#45の戦闘ループ編集とは分離する。本節は着手範囲・型の合意案であり、実装・受入完了の記録ではない。\n\n### 先にレビューする共通契約\n\n新規の公開JSONは、`packages/domain/src/spatial/publication.ts`（新設案）にZod schemaと推論型を集約する。platform I/Oを入れず、入力の上限・未知版の拒否・参照整合を検証する。既存schemaを再利用し、同じ意味の型をE2Eやwebへ複製しない。\n\n| 型（仮称） | 最小の責務・フィールド |\n| --- | --- |\n| `PublicCatalogCurrent` / `PublicCatalog` | schemaVersion、現行catalogHash、前世代catalogHash、公開setの参照。可変pointerと不変catalogを分離する |\n| `PublicReplaySet` / `PublicMatchPage` | schemaVersion、planId、生成元source、総行数、状態別件数、ページ数・ページ参照、各ページの試合行。ページ順・上限・hash/checksumの対象を固定する |\n| `PublicMatchRow` | slotId、simulationHash、参加者の名前/ID/revisionと配置・向き、戦場の名前/revision、seed、state/reason、reused、勝敗・終了step、再生の可否と理由 |\n| `PublicReplayRef` | objectHash、simulationHash、resultId、attemptId、replayId。既存`BundleReceiptSchema`の項目を再利用し、行→receipt→manifestが一致する対象だけを開く |\n\n- `HashSchema`・revision参照・`ExecutionSourceSchema`・`BatchSlotResultSchema`・`BundleReceiptSchema`・結果のschemaを再利用する。`state`は現在のバッチの `complete/failed/unresolved/truncated/pending` を基準とし、将来のリーグ専用状態を先行追加しない。\n- `unresolved/truncated`は記録が検証できた範囲だけ再生する。`failed/pending`を正常な再生として扱わない。参照なしの場合にresult/attempt等の架空IDを作らない。保存記録のcancelled診断は既存のreplay契約に従う。\n- JSONは配信時のContent-Encodingを展開した後のbytes、gzip artifactは圧縮bytesをchecksum対象とする。新規catalog/set/pageのhash対象と自己hashを除外するbodyの規則を型レビューで固定する。既存bundleはreceipt/manifest/gzipのbytesを保持し、コピー時の再整形・再圧縮でchecksumを変えない。\n- PR #84の`ReplayManifest`・`ReplayState`・`ArtifactRef`・`ReplaySource`・`OpenedReplay`を再利用する。通信interfaceの`ReplaySource`/`OpenedReplay`は引き続き`apps/web/src/replay/open-replay.ts`が所有し、domainへ移動しない。`seek(nextRecord)`のcursorをsimulation stepと同一視しない。\n- 新しい技・反応の内部状態を公開一覧へ複製しない。G-07/G-08が追加する表示記録は、既存manifest/表示reducerの版契約を通して後続viewerが読む。\n\n### 小PR1の所有範囲・完了条件\n\n1. 上記の型、公開layout、整合性fixtureを最初のレビュー単位にする。合意後、同じPRで`batch check`の照合処理を再利用したローカルdirectoryへのexportを実装する（#80小PR1の一覧生成を含む）。\n2. plan・index・bundle rootを読み、全予定枠と状態・未完了件数を保持する。公開データの生成に戦闘の再実行やSQLiteを要求しない。未完了の入力と整合性不正を区別する。\n3. 同じ入力での再export、既存objectとの不一致、行/receipt/manifestの参照不一致、欠落bundle、未完了枠、秘密情報・内部絶対パスの混入を試験する。\n4. exportの実装・CLI接続はAPI側の新規publication/exportモジュールと既存batchコマンドへの最小接続を所有する。画面・E2E側がexport処理を二重実装しない。\n\n### 並行作業の境界\n\n- 本PR: 公開用domain新規ファイル、export実装と試験、batch CLIの接続、必要な公開契約の文書。\n- #12: Playwright設定、E2E fixture/server/process管理、最小smoke、E2E用CI・証跡。型は本PRの公開契約を参照する。\n- `packages/domain/src/spatial/index.ts`のexport行は本PRが追加する。`package.json`・lockfile・CI設定へのE2E依存/コマンドは#12が所有する。両方で変更が必要になった場合は片方の反映後に追従し、同じブロックを同時編集しない。\n- `packages/engine/**`、戦闘loop、AI評価・資源精算、既存の技/反応schema・表示recordの拡張はG-07/G-08/#45の担当とする。公開型の追加が既存の実装digest対象に含まれる場合、機械的なstamp更新はマージ順に再実行し、競合したdigestを手で選ばない。\n- #12のserver/browser準備は型レビュー中から並行可能。公開fixtureは型の合意後に共有し、#79の静的adapterは本PRのlayout反映後に接続する。\n- R2書込み、Worker、Pages、3D viewer本体は後続の小PR。#81/#12のIssue全体の完了宣言は各受入条件が揃った時点で行う。\n\n## 9. クラウド公開workflowの追加契約（2026-09-24）\n\n- `Publish replays`は`workflow_dispatch`のみ。既存Pages gateで成功main push CI/ci-gateの最新attemptを検査し、指定CIのSHAとworkflow実行SHAの一致を要求する。\n- `plan_input`は`sample`（2試合）またはmainにコミット済みの`data/publication/<name>.json`。任意URLや未レビューの実行コードは取り込まない。\n- 計算jobと公開jobを分ける。受け渡しは同一runのimmutable artifact IDと許可済みplan/index/objectsに限定し、DB・`.work/`・環境設定は含めない。\n- 公開jobは`r2-publication`を使い、CIを再確認してから、公開stepだけでR2 Secretを使用する。`R2_PUBLICATION_ENABLED=true`が未設定なら公開しない。初期modeはdry-run。\n- 毎回の新しいrunnerにR2の保持世代を復元し、共有graph・bundle・展開後の秘密情報の検証を通してから既存export/publishを呼ぶ。復元中の欠落/破損/世代変更を拒否し、既存directoryを上書きしない。\n- workflowの復元読取りは256MBまで。既存の保存/転送/要求/時間上限を緩和しない。上限超過時に削除・自動増額・無制限再試行をしない。\n- 同じCI run IDと入力での再実行を支持し、artifact期限後は計算からやり直す。新しいrunnerでも過去リンクや公開世代を消さない。\n- Secret登録、実公開/再公開、本番UIと費用の受入を、実装/模擬試験とは区別する。初期設定と起動の手順はスマホのWeb画面で完結させる。\n\n## 10. 受入進捗（2026-09-25）\n\nPR #129 をmain `7b52751fde0403e80307184ba852c968e84b7b48` へ反映。実R2公開・新runnerからの再公開・Pagesの実再生/直接URL再読込・過去viewerへの切戻し/復帰を確認し、ADR 0008へ記録した。1,088試験、main CI（Releaseを含む）、正式PR/merge delivery、Pages deployは合格。公開build SHAもmainと一致する。\n\n詳細と証跡: [2026-09-25の受入記録](https://github.com/apaapapapapa/FantasySimulation/issues/81#issuecomment-5830033930)。\n\n| 受入項目 | 現在の状態 |\n| --- | --- |\n| §5の3〜5項目目、§6の1〜6・8〜9項目目 | 検証済み。各証跡は上記記録とADRを参照 |\n| §5の1項目目 | bucket非公開は確認済み。Workers Free/Paidと課金設定は未確認 |\n| §5の2項目目 | Environmentのmain制限・登録キーによる実公開は確認済み。登録したキーの対象bucket限定Object Read & Write権限は未確認 |\n| §6の7項目目 | 上限拒否・保存量・書込み/要求数・保持方針は確認済み。当期のアカウント全体の利用・実請求額が未確認 |\n\n接続中Cloudflare APIは契約/請求で10000、トークンmetadataで9109を返す。スマホのCloudflare画面で上記3点を確認できる情報が必要（キー値・支払情報は不要）。「受入完了までチェックしない」という本文の方針を維持し、未確認事項を免除せず、完了宣言・クローズはまだ行わない。\n",'Concurrent Issue edit: reread');
            const body="## 位置付け\n\n親: #10（③）。関連: [ADR 0006](https://github.com/apaapapapapa/FantasySimulation/blob/main/docs/adr/0006-recorded-replay.md)（配信契約）、[ADR 0008][adr0008]（bundle）、#6（CI）、#5（証跡）、#8（依存・秘密情報の検査）。旧#10のR6・R7・A2・A4。\n\nユーザー決定（2026-09-25更新。公開先の選択は2026-09-23を維持）:\n\n- **ユーザーはスマホのChatGPTアプリからCodex等に指示し、自分のPCを一切使わない。ターミナル・ローカル`.env`の作成を要求しない。**\n- 画面はGitHub Pages、データはCloudflare R2に最初から置く。\n- 独自ドメインがないため、R2は非公開のままにし、読取専用のWorker（workers.dev）経由で配信する。r2.devは使わない。\n- 公開用の対戦計算・保存はGitHub ActionsのLinux runnerで行う。公開は成功したmainのCIを確認した上で明示的に手動起動する。Codexの開発・PRテストに本番キーは渡さない。\n- R2資格情報（現行のアカウント全体権限を2026-09-25にユーザー承認）は、GitHub Environment `r2-publication` のSecretsに保存する。従来の「ローカル`.env`のみ」「GitHub Secrets禁止」は、この保護されたEnvironment運用に置き換える。repository全体のSecrets、コード、チャット、ブラウザーへの保存はしない。\n- 費用: R2とWorkers Freeの無料枠内で運用する。公開コマンドは、設定した上限（既定は保存8GB）を超える公開を開始前に拒否する。超える見込みになったら、公開を止めて相談する。\n\n設定・配備の進捗は各コメントの実測記録を参照。5章と6章は受入完了までチェックしない。ユーザーの初期操作はスマホのWeb画面で完結させる。今回のクラウド運用への変更はPR #105で対応する。\n\n## 1. 公開layout（R2と実行環境内の確認で共通）\n\n```text\ncatalog/current.json            可変。最新の公開世代を指す（cacheは短期）\ncatalog/<catalogHash>.json      不変。公開中のsetの一覧と、1つ前の世代\nsets/<setHash>/set.json         不変。対戦条件、参加者、生成元source、行数、ページ数\nsets/<setHash>/<pageHash>.json   不変。試合一覧のページ（#80の行の形式）\nobjects/<objectHash>/...        不変。ADR 0008のbundle（receipt・manifest・chunk・checkpoint）\n```\n\n- 確定した名前・上限・checksum規則はADR 0008とdomainの公開schemaを正本とする。#79の静的adapterと#80の一覧は同じ形式を読む。\n- `current.json`以外は内容のhashで名前を付け、上書きしない。同じbundleは、複数のsetや世代から共有する。\n- 各ファイルについて、checksumの対象bytesを決める。gzipは圧縮bytesを対象にする。JSONは配信時に自動で圧縮・展開されることがあるため、展開後のbytesを対象にする。\n- 次の情報は公開しない: ローカルDB、`.work/`、下書き、内部の絶対パス、環境変数、認証情報。\n\n## 2. exportと公開コマンド（クラウドのNode実行環境）\n\n- 入力は、`batch check`で照合した計画・index・bundle rootとする。未完了の枠を含む計画をCLIで公開する場合は、行ごとの状態と未完了の数を表示し、完了した計画と区別する。今回のActions workflowは完了した計算のみを公開するが、CLIの未完了行の契約は変更しない。\n- まず実行環境内のdirectoryへexportし、R2への保存にも同じ出力を使う。任意の開発用ローカル確認は残してよいが、ユーザーPCは必要条件にしない。\n- R2への書込には`@aws-sdk/client-s3`を使い、独自の署名処理を作らない。認証情報はユーザー承認済みの現行R2 tokenを使用し、GitHub Environment `r2-publication`のSecretsへ保存する。公開stepだけに環境変数として渡す。repo内ファイル、Pages生成物、ブラウザー、ログ、チャット、Codexの開発環境には置かない。\n- 書込の順序: bundle（検証済み）→setのページ→`set.json`→`catalog/<hash>`→`catalog/current.json`。複数objectの書込を、1つの原子的な操作と見なさない。\n- 既存のobjectは内容を照合して再利用し、上書きしない。同じsimulationHashで結果やevent hashが異なる場合は、公開を止める。\n- `current.json`を更新する前に、読んだ世代と新しい世代が参照する前の世代が一致することを確認し、古い公開で新しい世代を巻き戻さない。workflow concurrencyで逐次公開し、conditional PUTも維持する。\n- 転送の件数・bytes・並列数、再試行の回数と期限に上限を置く。認証の失敗や不正な入力を再試行し続けない。通信の成功と、公開の確定を区別する。\n- 公開後、S3 APIで各objectの存在とサイズを確認する。あわせて、catalog・setと抽出したbundleをWorker経由で読み戻し、checksumを照合してから完了とする。公開作業でWorkerの1日のリクエスト上限を使い切らない。\n- viewerとの互換: データの生成元のsource SHAが、公開中のviewerのsource SHAと同じか、その祖先であることを確認してから`current.json`を更新する。viewerは`build.json`に、自身のSHAと対応する版を出す。\n- 保存量の上限: 公開前に保存量と書込回数の見込みを表示し、設定した上限（既定は保存8GB。R2の無料枠10GBに余裕を残す）を超える公開は開始前に拒否する。アカウント全体の利用量・課金確認も別途必要。\n- 削除は明示的なコマンドだけで行う。保持中の世代から参照されるobjectは削除しない。容量を空けるために自動で削除しない。\n\n## 3. 読取Worker（workers.dev）\n\n- GET・HEAD・OPTIONSだけを受け付ける。R2 bindingのgetとheadだけを使い、書込と一覧はしない。\n- keyを公開layoutの形式（prefixとhashの名前）に限定し、`..`、任意のURL、一覧の要求を拒否する。\n- Content-Typeは、`.json`をapplication/json、`.gz`をapplication/gzipとし、`Content-Encoding`を付けない（ADR 0006）。\n- Cache-Controlは、不変のobjectを長期（immutable）、`catalog/current.json`を短期にする。\n- CORSは、`https://apaapapapapa.github.io`（pathを含まないorigin）だけを許可する。CORSを認証の代わりにせず、公開してよいデータだけを置く。\n- 無料枠の上限（Error 1027）、404、その他のエラーを区別できるようにする。#79では「配信の上限」「公開終了」「破損」を分けて表示する。\n- 1試合を観戦するのに必要なリクエスト数を測定し、1日の上限で何試合を観戦できるかを記録する。\n- コードはrepoで管理し、fakeのR2 bindingで単体試験する。置き場所と依存（型定義・デプロイ用のツール）は、依存方向の検査に規則を追加してレビューする。デプロイは認可済みクラウド連携、または別途最小権限に制限した配備経路で明示的に行い、コードhashを記録する。ユーザーPCからの実行を要求しない。R2公開用キーとWorker配備権限は混同しない。\n\n## 4. GitHub Pages\n\n- `apps/web`を`base: '/FantasySimulation/'`でbuildする。hash routingを使い、asset・Web Worker・データのURLを確認する。独自ドメインを使う場合に備えて、baseを切り替えられるようにする。\n- データのbase URL（WorkerのURL）は、build時の公開設定とする（secretではない）。`<meta>`でCSPを設定し、接続先を自身とWorkerのoriginに限定する。\n- deployのworkflow: mainのCI（#6のci-gate）が成功したSHAだけをbuild・deployする。PRやforkからは公開しない。`pages: write`と`id-token: write`はdeployのjobだけに与える。固定のtoolchain（Vite+・pnpm・`.node-version`）を使い、公式サンプルのnpmや可変のNode版に置き換えない。semantic-releaseとは別の処理にする。\n- `build.json`（source SHA、対応する版）を配信する。\n- 過去のSHAを再デプロイしても、公開中のデータを読めることを確認する。\n- 最初のデプロイは、#79の初版が完成した後に行う。\n\n## 5. 外部設定（スマホのWeb画面または認可済みクラウド連携。完了するまでチェックしない）\n\n- [ ] R2のbucketを作成する（公開アクセスは無効のまま）。CloudflareのWorkersのプラン（Free/Paid）と課金の設定を確認して記録する\n- [ ] ユーザー承認済みの現行R2キーを、GitHub Environment `r2-publication`の`R2_ACCESS_KEY_ID`・`R2_SECRET_ACCESS_KEY`へ登録する。Environmentはbranch `main`だけを許可し、変数`R2_ACCOUNT_ID`・`R2_PUBLICATION_ENABLED=true`を設定する。ローカル`.env`は不要\n- [ ] 読取WorkerをR2 binding付きでクラウドからデプロイし、URL・コードhashを記録する\n- [ ] 利用量と費用を確認する方法（通知等）を設定する\n- [ ] リポジトリのPagesの公開元を「GitHub Actions」にする\n\n## 6. 受入条件\n\n- [ ] ユーザーPCを使わず、GitHub Actionsで計算したバッチ結果をlayoutのとおりにR2へ保存し、Worker経由で読み戻して照合できる\n- [ ] APIを止めた状態で、Pagesの画面からWorker経由でデータを読み、試合一覧→選択→再生→直接URLの再読込が成立する。CIのE2Eでは、Workerの代わりに別originのローカル静的サーバーを使う。本番での確認は手動で行い、記録する\n- [ ] 新しいrunnerでの復元・再公開でも同じobjectを再利用し、hashが一貫する。過去のリンクが別の内容に変わらない\n- [ ] 公開途中の停止と再実行、既存objectとの不一致、古い世代での上書き、viewerと非互換のデータを、fakeのS3等を使ったfixtureで検証する。許可済みのbucketでの受入試験とは区別する\n- [ ] 公開データと生成物に、秘密情報、ローカルDB、絶対パスが含まれないことを検査する。PR/Codexの開発環境に本番Secretを渡さない\n- [ ] Workerが書込・一覧・形式外のkeyを拒否し、CORSが公開originだけを許可する\n- [ ] 上限を超える公開・復元を拒否する。実測の保存量・書込回数・リクエスト数・費用と、保持の方針をADRに記録する\n- [ ] PagesへのdeployとR2公開が、mainの合格したSHAからだけ行われる。R2公開は明示的な手動起動・既定dry-run・逐次実行で、Environmentの制限後にも最新attemptのCIを確認する\n- [ ] `vp run verify`、Linux CI、#5の証跡で確認する\n\n## 7. 小PR\n\n1. 公開layoutと、実行環境内directoryへのexport（#80の一覧ファイルの生成を含む）\n2. GitHub Pagesのdeployのworkflow（base、hash routing、`build.json`、CSP）。#79の初版の後に行う\n3. 読取Workerのコードと試験\n4. R2への公開コマンド（S3 client、順序、再利用、世代、上限、読み戻し）\n5. PC不要の運用方針・保護されたActions公開・保持世代の復元（PR #105）\n6. 外部設定の後の受入（実際のbucket・Worker・Pagesでの確認とADR）\n\n[adr0008]: https://github.com/apaapapapapa/FantasySimulation/blob/main/docs/adr/0008-headless-batch.md\n\n## 8. 先行PRの分割方針と共通契約案（2026-09-23の記録）\n\n本節の「ローカルdirectory」は実行環境内のfilesystemを指す。2026-09-24以降、ユーザーPCを要求する根拠にはしない。\n\nユーザー方針: **本Issueの小PR1と#12のE2E準備を分け、画面側に必要な共通型だけ先にレビューする。** G-07/G-08および#45の戦闘ループ編集とは分離する。本節は着手範囲・型の合意案であり、実装・受入完了の記録ではない。\n\n### 先にレビューする共通契約\n\n新規の公開JSONは、`packages/domain/src/spatial/publication.ts`（新設案）にZod schemaと推論型を集約する。platform I/Oを入れず、入力の上限・未知版の拒否・参照整合を検証する。既存schemaを再利用し、同じ意味の型をE2Eやwebへ複製しない。\n\n| 型（仮称） | 最小の責務・フィールド |\n| --- | --- |\n| `PublicCatalogCurrent` / `PublicCatalog` | schemaVersion、現行catalogHash、前世代catalogHash、公開setの参照。可変pointerと不変catalogを分離する |\n| `PublicReplaySet` / `PublicMatchPage` | schemaVersion、planId、生成元source、総行数、状態別件数、ページ数・ページ参照、各ページの試合行。ページ順・上限・hash/checksumの対象を固定する |\n| `PublicMatchRow` | slotId、simulationHash、参加者の名前/ID/revisionと配置・向き、戦場の名前/revision、seed、state/reason、reused、勝敗・終了step、再生の可否と理由 |\n| `PublicReplayRef` | objectHash、simulationHash、resultId、attemptId、replayId。既存`BundleReceiptSchema`の項目を再利用し、行→receipt→manifestが一致する対象だけを開く |\n\n- `HashSchema`・revision参照・`ExecutionSourceSchema`・`BatchSlotResultSchema`・`BundleReceiptSchema`・結果のschemaを再利用する。`state`は現在のバッチの `complete/failed/unresolved/truncated/pending` を基準とし、将来のリーグ専用状態を先行追加しない。\n- `unresolved/truncated`は記録が検証できた範囲だけ再生する。`failed/pending`を正常な再生として扱わない。参照なしの場合にresult/attempt等の架空IDを作らない。保存記録のcancelled診断は既存のreplay契約に従う。\n- JSONは配信時のContent-Encodingを展開した後のbytes、gzip artifactは圧縮bytesをchecksum対象とする。新規catalog/set/pageのhash対象と自己hashを除外するbodyの規則を型レビューで固定する。既存bundleはreceipt/manifest/gzipのbytesを保持し、コピー時の再整形・再圧縮でchecksumを変えない。\n- PR #84の`ReplayManifest`・`ReplayState`・`ArtifactRef`・`ReplaySource`・`OpenedReplay`を再利用する。通信interfaceの`ReplaySource`/`OpenedReplay`は引き続き`apps/web/src/replay/open-replay.ts`が所有し、domainへ移動しない。`seek(nextRecord)`のcursorをsimulation stepと同一視しない。\n- 新しい技・反応の内部状態を公開一覧へ複製しない。G-07/G-08が追加する表示記録は、既存manifest/表示reducerの版契約を通して後続viewerが読む。\n\n### 小PR1の所有範囲・完了条件\n\n1. 上記の型、公開layout、整合性fixtureを最初のレビュー単位にする。合意後、同じPRで`batch check`の照合処理を再利用したローカルdirectoryへのexportを実装する（#80小PR1の一覧生成を含む）。\n2. plan・index・bundle rootを読み、全予定枠と状態・未完了件数を保持する。公開データの生成に戦闘の再実行やSQLiteを要求しない。未完了の入力と整合性不正を区別する。\n3. 同じ入力での再export、既存objectとの不一致、行/receipt/manifestの参照不一致、欠落bundle、未完了枠、秘密情報・内部絶対パスの混入を試験する。\n4. exportの実装・CLI接続はAPI側の新規publication/exportモジュールと既存batchコマンドへの最小接続を所有する。画面・E2E側がexport処理を二重実装しない。\n\n### 並行作業の境界\n\n- 本PR: 公開用domain新規ファイル、export実装と試験、batch CLIの接続、必要な公開契約の文書。\n- #12: Playwright設定、E2E fixture/server/process管理、最小smoke、E2E用CI・証跡。型は本PRの公開契約を参照する。\n- `packages/domain/src/spatial/index.ts`のexport行は本PRが追加する。`package.json`・lockfile・CI設定へのE2E依存/コマンドは#12が所有する。両方で変更が必要になった場合は片方の反映後に追従し、同じブロックを同時編集しない。\n- `packages/engine/**`、戦闘loop、AI評価・資源精算、既存の技/反応schema・表示recordの拡張はG-07/G-08/#45の担当とする。公開型の追加が既存の実装digest対象に含まれる場合、機械的なstamp更新はマージ順に再実行し、競合したdigestを手で選ばない。\n- #12のserver/browser準備は型レビュー中から並行可能。公開fixtureは型の合意後に共有し、#79の静的adapterは本PRのlayout反映後に接続する。\n- R2書込み、Worker、Pages、3D viewer本体は後続の小PR。#81/#12のIssue全体の完了宣言は各受入条件が揃った時点で行う。\n\n## 9. クラウド公開workflowの追加契約（2026-09-24）\n\n- `Publish replays`は`workflow_dispatch`のみ。既存Pages gateで成功main push CI/ci-gateの最新attemptを検査し、指定CIのSHAとworkflow実行SHAの一致を要求する。\n- `plan_input`は`sample`（2試合）またはmainにコミット済みの`data/publication/<name>.json`。任意URLや未レビューの実行コードは取り込まない。\n- 計算jobと公開jobを分ける。受け渡しは同一runのimmutable artifact IDと許可済みplan/index/objectsに限定し、DB・`.work/`・環境設定は含めない。\n- 公開jobは`r2-publication`を使い、CIを再確認してから、公開stepだけでR2 Secretを使用する。`R2_PUBLICATION_ENABLED=true`が未設定なら公開しない。初期modeはdry-run。\n- 毎回の新しいrunnerにR2の保持世代を復元し、共有graph・bundle・展開後の秘密情報の検証を通してから既存export/publishを呼ぶ。復元中の欠落/破損/世代変更を拒否し、既存directoryを上書きしない。\n- workflowの復元読取りは256MBまで。既存の保存/転送/要求/時間上限を緩和しない。上限超過時に削除・自動増額・無制限再試行をしない。\n- 同じCI run IDと入力での再実行を支持し、artifact期限後は計算からやり直す。新しいrunnerでも過去リンクや公開世代を消さない。\n- Secret登録、実公開/再公開、本番UIと費用の受入を、実装/模擬試験とは区別する。初期設定と起動の手順はスマホのWeb画面で完結させる。\n\n## 10. 受入進捗（2026-09-25）\n\nPR #129 をmain `7b52751fde0403e80307184ba852c968e84b7b48` へ反映。実R2公開・新runnerからの再公開・Pagesの実再生/直接URL再読込・過去viewerへの切戻し/復帰を確認し、ADR 0008へ記録した。1,088試験、main CI（Releaseを含む）、正式PR/merge delivery、Pages deployは合格。公開build SHAもmainと一致する。\n\n詳細と証跡: [2026-09-25の受入記録](https://github.com/apaapapapapa/FantasySimulation/issues/81#issuecomment-5830033930)。\n\n| 受入項目 | 現在の状態 |\n| --- | --- |\n| §5の3〜5項目目、§6の1〜6・8〜9項目目 | 検証済み。各証跡は上記記録とADRを参照 |\n| §5の1項目目 | bucket非公開を確認済み。提供画面でWorkers Paid「終了中」（更新日欄10月12日）・R2 Paid「アクティブ」を確認。Free移行済みとは扱わない |\n| §5の2項目目 | Environmentのmain制限・登録キーによる実公開を確認済み。現行権限はユーザー承認により受入。bucket限定への変更は必須条件から除外（限定済みと偽らない） |\n| §6の7項目目 | 上限拒否・保存量・書込み/要求数・保持方針を確認済み。提供画面の9月12〜25日観測の従量課金は$0.00で含まれる枠内。固定契約料とは区別する |\n\n接続中Cloudflare APIは契約/請求で10000、トークンmetadataで9109を返すため、外部確認はユーザー提供画面と明示判断で補完した。最終PRのADR・完了宣言とmain CIを経て、既存Issue completionがチェックリスト更新とクローズを行う。\n\n## 11. 外部受入の確定記録（2026-09-25）\n\n- [権限に関するユーザー判断](https://github.com/apaapapapapa/FantasySimulation/issues/81#issuecomment-5833903078)：現行アカウント全体のR2権限を許容し、キー再作成・差替えは不要。main限定Environmentと公開stepだけのSecret利用は継続する。\n- [契約画面の確認](https://github.com/apaapapapapa/FantasySimulation/issues/81#issuecomment-5833872466)：Workers Paidは終了中、更新日欄2026-10-12。R2 Paidはアクティブ。既存契約の変更やWorkers Freeへの移行を本Issueで実施したとは扱わない。\n- [当期従量課金の確認](https://github.com/apaapapapapa/FantasySimulation/issues/81#issuecomment-5833944717)：観測期間2026-09-12〜09-25、サイクル09-12〜10-11（14/30日）。合計・予測・日平均$0.00、全使用量は含まれるティアの上限内、予算アラート2件。固定契約料・過去の支払済み請求とは別で、将来の料金ゼロやFree契約の証明にはしない。無料枠を目安とする公開上限と超過見込み時の相談方針は継続する。\n";
            await github.rest.issues.update({...args,body});
            const after=(await github.rest.issues.get(args)).data;
            assert.equal(after.body,body);
            assert.equal(after.state,'open');
            console.log(JSON.stringify({url:after.html_url,state:after.state,updatedAt:after.updated_at}));
      - name: Generate the existing completion draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .generated/harness/issue81
          node scripts/harness.ts issue-plan 81 > .generated/harness/issue81/plan.json
          cat .generated/harness/issue81/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue81-plan-${{ github.run_id }}
          path: .generated/harness/issue81/plan.json
          include-hidden-files: true
          retention-days: 30
