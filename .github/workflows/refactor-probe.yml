name: Refactor pinned package manager
on:
  push:
    branches: [refactor/verification-probe]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Export package payload only
        run: |
          mkdir -p .generated/pinned-pnpm
          npm pack pnpm@11.27.1 --pack-destination .generated/pinned-pnpm --ignore-scripts
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          writeFileSync('.generated/pinned-pnpm/provenance.json',JSON.stringify({
            version:'11.27.1',probeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,
            sha256:createHash('sha256').update(readFileSync('.generated/pinned-pnpm/pnpm-11.27.1.tgz')).digest('hex'),
            purpose:'Public pinned package transport only; no configuration, credentials or verification approval'
          },null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refactor-pinned-pnpm
          path: .generated/pinned-pnpm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
