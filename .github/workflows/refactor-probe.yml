name: Refactor pinned runtime
on:
  push:
    branches: [refactor/verification-probe]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Export actual Node binary without environment or credentials
        run: |
          node --input-type=module <<'NODE'
          import {copyFileSync,chmodSync,mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          if(process.versions.node!=='24.19.0') throw Error('Unexpected pinned Node');
          mkdirSync('.generated/pinned-node',{recursive:true});
          copyFileSync(process.execPath,'.generated/pinned-node/node');
          chmodSync('.generated/pinned-node/node',0o755);
          writeFileSync('.generated/pinned-node/provenance.json',JSON.stringify({
            version:process.version,probeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,
            sha256:createHash('sha256').update(readFileSync(process.execPath)).digest('hex'),
            purpose:'Pinned runtime transport only; no verification approval'
          },null,2));
          NODE
          tar -czf .generated/refactor-node.tgz -C .generated/pinned-node .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refactor-pinned-node
          path: .generated/refactor-node.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
