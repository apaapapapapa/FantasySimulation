name: Finalize Drizzle candidate
on:
  push:
    branches: [codex/drizzle-kit-complete-20260923]
    paths: [.github/workflows/drizzle-finalize.yml]
permissions:
  contents: read
jobs:
  finalize:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.ref == 'refs/heads/codex/drizzle-kit-complete-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Apply reviewed test and setup documentation corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = '通常の開発に別のDBサーバーやDocker、Pythonのインストールは不要です。'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '通常の開発に別のDBサーバーやDockerは不要です。\nSQLiteドライバーのインストールでネイティブビルドが必要な環境では、PythonとC++ビルドツールを用意してください。'))
          p = Path('apps/api/src/drizzle.test.ts')
          text = p.read_text()
          old = '  expect(result.status, result.stdout + result.stderr).toBe(0);'
          assert text.count(old) == 1
          text = text.replace(old, "  if (result.status !== 0) throw new Error(result.stdout + result.stderr);\n  expect(result.status).toBe(0);")
          target = "  it('keeps TypeScript schema and generated snapshots synchronized using Kit generate', () => {"
          assert text.count(target) == 1
          addition = '''  it('applies a Kit-generated incremental migration without replaying earlier SQL', () => {
            const directory = temporary();
            const output = join(directory, 'drizzle');
            cpSync(migrationsFolder, output, { recursive: true });
            const filename = join(directory, 'incremental.sqlite');
            const sqlite = new Database(filename);
            try {
              const db = drizzle(sqlite);
              migrate(db, { migrationsFolder: output });
              sqlite.prepare('INSERT INTO characters VALUES (?, ?, ?)').run('existing', '{}', 'before');
              const before = receipts(sqlite);
              const files = new Set(readdirSync(output));
              const config = join(directory, 'drizzle.config.ts');
              writeFileSync(config, `export default ${JSON.stringify({
                dialect: 'sqlite',
                schema: resolve(repositoryRoot, 'apps/api/src/db/schema.ts'),
                out: output,
              })};\\n`);
              runKit(['generate', '--custom', '--name=incremental_probe', `--config=${config}`], filename);
              const generated = readdirSync(output).filter((name) => name.endsWith('.sql') && !files.has(name));
              expect(generated).toHaveLength(1);
              const migration = generated[0];
              if (!migration) throw new Error('Kit did not generate an incremental migration');
              writeFileSync(join(output, migration), 'ALTER TABLE characters ADD COLUMN migration_probe TEXT;\\n');
              migrate(db, { migrationsFolder: output });
              const after = receipts(sqlite);
              expect(after).toHaveLength(before.length + 1);
              expect(after.slice(0, before.length)).toEqual(before);
              expect(sqlite.prepare('SELECT id, definition, updated_at, migration_probe FROM characters').all())
                .toEqual([{ id: 'existing', definition: '{}', updated_at: 'before', migration_probe: null }]);
              migrate(db, { migrationsFolder: output });
              expect(receipts(sqlite)).toEqual(after);
            } finally { sqlite.close(); }
          }, 90000);

          '''
          p.write_text(text.replace(target, addition + target))
          PY
          vp fmt
          git rm .github/workflows/drizzle-finalize.yml
          vp exec node scripts/engine-identity.ts --write
          git add -A
          git diff --cached --stat
          git diff --cached -- packages/engine/src/spatial/implementation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(db): verify incremental Drizzle upgrades and strict configuration coverage'
          git push origin HEAD:refs/heads/codex/drizzle-kit-complete-20260923
      - name: Run focused real database regressions
        run: vp test run apps/api
      - name: Verify the clean generated source through the existing harness
        shell: bash
        run: |
          echo "Development source commit: $(git rev-parse HEAD); PR evidence is collected by canonical CI."
          env -u GITHUB_SHA -u GITHUB_EVENT_NAME vp exec node scripts/harness.ts source .generated/harness/drizzle-finalization
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drizzle-finalization-evidence
          path: .generated/harness/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
