name: Dependency policy

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * 1'

permissions:
  contents: read

jobs:
  configuration:
    name: Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENOVATE_VALIDATOR_VERSION: 44.111.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: Validate with the pinned official Renovate validator
        id: validator
        run: >-
          pnpm --package="renovate@$RENOVATE_VALIDATOR_VERSION" dlx
          renovate-config-validator --strict renovate.json
      - name: Record the actual validator outcome
        if: always()
        run: node scripts/security/validator.ts
        env:
          H4_VALIDATOR_OUTCOME: ${{ steps.validator.outcome }}
          H4_REPORT_DIR: ${{ runner.temp }}/h4-renovate
          H4_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          H4_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload sanitized validator receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-renovate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h4-renovate/*.json
          if-no-files-found: error
          retention-days: 14

  toolchain:
    name: Toolchain policy (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: Version coupling and guarded automerge regression tests
        run: node --test scripts/security/toolchain.test.ts scripts/security/renovate-file.test.ts
      - name: Check actual repository pins and bot policy
        run: node scripts/security/toolchain.ts
        env:
          H4_REPORT_DIR: ${{ runner.temp }}/h4-toolchain
          H4_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          H4_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload sanitized toolchain receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-toolchain-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h4-toolchain/*.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: dependency-policy-gate
    needs: [configuration, toolchain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require validator and Linux toolchain policy
        env:
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
        run: |
          test "$CONFIGURATION_RESULT" = success
          test "$TOOLCHAIN_RESULT" = success
