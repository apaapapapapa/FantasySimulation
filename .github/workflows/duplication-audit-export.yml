name: Duplication audit export
on:
  push:
    branches: [refactor/duplication-guard]
    paths: [.github/workflows/duplication-audit-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Export locked dependencies and runtime for offline verification
        shell: bash
        run: |
          mkdir -p .generated/audit-tools
          cp "$(vp exec node -p 'process.execPath')" .generated/audit-tools/node
          cp "$(command -v vp)" .generated/audit-tools/vp
          tar -cf toolchain.tar node_modules apps/*/node_modules packages/*/node_modules .generated/audit-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: duplication-audit-toolchain
          path: toolchain.tar
          retention-days: 1
          if-no-files-found: error
