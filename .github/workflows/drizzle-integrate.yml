name: Integrate Drizzle candidate
on:
  push:
    branches: [codex/drizzle-kit-complete-20260923]
    paths: [.github/workflows/drizzle-integrate.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.ref == 'refs/heads/codex/drizzle-kit-complete-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Merge the reviewed concurrent main snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 00f466223dd510840432779d96c9fad696249549 || true
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          allowed = {'package.json','packages/engine/src/spatial/implementation.json'}
          if set(conflicts) - allowed:
              subprocess.run(['git','diff','--cc'], check=True)
              raise RuntimeError(f'Unreviewed conflicts: {conflicts}')
          if 'package.json' in conflicts:
              content = subprocess.check_output(['git','show','00f466223dd510840432779d96c9fad696249549:package.json'], text=True)
              data = json.loads(content)
              data['scripts'].update({
                  'db:generate':'node --env-file-if-exists=.env node_modules/drizzle-kit/bin.cjs generate',
                  'db:migrate':'node --env-file-if-exists=.env node_modules/drizzle-kit/bin.cjs migrate',
                  'db:check':'node --env-file-if-exists=.env node_modules/drizzle-kit/bin.cjs check',
              })
              del data['scripts']['db:reset']
              data['devDependencies'].update({'drizzle-kit':'0.31.11','drizzle-orm':'0.45.3','better-sqlite3':'13.0.3'})
              Path('package.json').write_text(json.dumps(data,indent=2)+'\n')
          if 'packages/engine/src/spatial/implementation.json' in conflicts:
              subprocess.run(['git','checkout','--theirs','--','packages/engine/src/spatial/implementation.json'],check=True)
          PY
          vp fmt
          git rm .github/workflows/drizzle-integrate.yml
          vp exec node scripts/engine-identity.ts --write
          git add -A
          git diff --cached --stat
          git diff --cached -- package.json packages/engine/src/spatial/implementation.json
          git commit -m 'chore(db): integrate current main and restamp dependency-bound identity'
          git push origin HEAD:refs/heads/codex/drizzle-kit-complete-20260923
      - name: Development verification of the actual generated commit
        shell: bash
        run: |
          echo "Development source commit: $(git rev-parse HEAD); this is not PR CI evidence."
          env -u GITHUB_SHA -u GITHUB_EVENT_NAME vp exec node scripts/harness.ts source .generated/harness/drizzle-integration
      - name: Show verification observations
        if: always()
        shell: bash
        run: |
          test ! -f .generated/harness/drizzle-integration/report.json || cat .generated/harness/drizzle-integration/report.json
          test ! -f .generated/harness/drizzle-integration/verify.log || tail -n 180 .generated/harness/drizzle-integration/verify.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drizzle-integration-evidence
          path: .generated/harness/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
