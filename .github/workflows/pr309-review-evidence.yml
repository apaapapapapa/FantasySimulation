name: PR 309 read-only review evidence
on:
  push:
    branches: [audit/pr309-review-state-20261004]
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const result = await github.graphql(`query {
              repository(owner: "apaapapapapa", name: "FantasySimulation") {
                pullRequest(number: 309) {
                  headRefOid baseRefOid updatedAt reviewDecision
                  reviewThreads(first: 100) {
                    nodes {
                      id isResolved isOutdated
                      comments(first: 100) {
                        nodes { id databaseId body url updatedAt author { login } }
                        pageInfo { endCursor hasNextPage }
                      }
                    }
                    pageInfo { endCursor hasNextPage }
                  }
                }
              }
            }`);
            core.info("FANTASY_REVIEW_QUERY=" + JSON.stringify({queriedAt: new Date().toISOString(), ...result}));
