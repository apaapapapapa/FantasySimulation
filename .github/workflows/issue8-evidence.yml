name: Issue 8 source evidence
on:
  push:
    branches: [ops/issue8-minor-evidence]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c2a070ee0f459c7e24158dc1745e53639bcd04d2
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - name: Wait for the exact main CI with a finite budget
        run: timeout 420s gh run watch 36242920989 --interval 15 --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect actual PR and main evidence using the existing read-only harness
        if: always()
        run: vp run harness github-snapshot apaapapapapa/FantasySimulation 175 .generated/harness/issue8-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Export exact public main source and public issue body
        if: always()
        run: |
          mkdir -p .generated/harness/issue8-export
          git bundle create .generated/harness/issue8-export/source.bundle HEAD
          gh api repos/apaapapapapa/FantasySimulation/issues/8 > .generated/harness/issue8-export/issue8.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: issue8-main-evidence
          path: .generated/harness/issue8-*/
          retention-days: 1
          include-hidden-files: true
