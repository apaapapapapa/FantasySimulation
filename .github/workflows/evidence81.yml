name: Issue 81 delivery evidence
on:
  push:
    branches: [ops/81-acceptance-20260925]
    paths: [.github/workflows/evidence81.yml]
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feb61f3e46e51dc79aeb613f9bc26ec99212f29b
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for merged main CI and Pages
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 0
          script: |
            const assert=require('node:assert/strict');
            let ready=false;
            for(let i=0;i<60;i++) {
              const ci=(await github.rest.actions.listWorkflowRuns({owner:'apaapapapapa',repo:'FantasySimulation',workflow_id:'ci.yml',event:'push',branch:'main',head_sha:'feb61f3e46e51dc79aeb613f9bc26ec99212f29b',per_page:100})).data.workflow_runs.sort((a,b)=>b.id-a.id)[0];
              const pages=(await github.rest.actions.listWorkflowRuns({owner:'apaapapapapa',repo:'FantasySimulation',workflow_id:'pages.yml',head_sha:'feb61f3e46e51dc79aeb613f9bc26ec99212f29b',per_page:100})).data.workflow_runs.sort((a,b)=>b.id-a.id)[0];
              if(ci?.status==='completed') assert.equal(ci.conclusion,'success','Merged main CI failed');
              if(ci?.conclusion==='success' && pages?.status==='completed') {
                assert.equal(pages.conclusion,'success','Final Pages deployment failed');
                console.log('MERGED_RUNS='+JSON.stringify({ci:ci.id,pages:pages.id,sha:ci.head_sha}));
                ready=true;break;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            assert.ok(ready,'Main CI/Pages did not finish within observation budget');
      - uses: ./.github/actions/setup-project
      - name: Collect PR 136 exact-head evidence with the existing read-only harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run harness github-snapshot apaapapapapa/FantasySimulation 136 .generated/harness/pr81-final
      - name: Verify served build and unchanged published catalog
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          let build;
          for(let i=0;i<18;i++) {
            const response=await fetch('https://apaapapapapa.github.io/FantasySimulation/build.json?acceptance='+process.env.GITHUB_RUN_ID,{signal:AbortSignal.timeout(15000)});
            assert.equal(response.status,200);
            build=await response.json();
            if(build.sourceSha==='feb61f3e46e51dc79aeb613f9bc26ec99212f29b')break;
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert.equal(build.sourceSha,'feb61f3e46e51dc79aeb613f9bc26ec99212f29b');
          const response=await fetch('https://fantasysimulation-replay-reader.tokyojp.workers.dev/catalog/current.json',{signal:AbortSignal.timeout(15000)});
          assert.equal(response.status,200);
          const catalog=await response.json();
          assert.equal(catalog.catalogHash,'sha256:4aeaf1d03e15f71e99fad1b22b14f8798fe051ea21f492e90d29b13e56fadf9d');
          const result={verifiedAt:new Date().toISOString(),build,catalog,mutations:0};
          writeFileSync('.generated/harness/pr81-final/production.json',JSON.stringify(result,null,2));
          console.log('FINAL_PRODUCTION='+JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-final-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/pr81-final/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
