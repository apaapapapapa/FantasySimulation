name: Issue 81 delivery evidence
on:
  push:
    branches: [ops/81-acceptance-20260925]
    paths: [.github/workflows/evidence81.yml]
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a26b32d104d410a1b355672f3cfb432fe45bbcd5
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Collect existing PR delivery evidence without production keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run harness github-snapshot apaapapapapa/FantasySimulation 129 .generated/harness/pr81
      - name: Assess the actual reviewed PR with the existing delivery harness
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {conversationDigest} from './scripts/harness/delivery.ts';
          const s=JSON.parse(readFileSync('.generated/harness/pr81/github-snapshot.json','utf8'));
          const receipt={"candidateSha":"a26b32d104d410a1b355672f3cfb432fe45bbcd5","conversationDigest":"56031de27efb2ffaaca39d0ff119d7dc41dda805f4865d3b60717d5d2d90505f","reviewedPaths":["docs/adr/0008-headless-batch.md"],"completedAt":"2026-09-25T08:48:45.459Z","method":"self","summary":"Read the entire changed ADR and all PR discussion, reviews and threads. Matched production run SHA, graph, measured request counts, rollback/restore and external permission failures. Latest-head Codex review completed with no findings; no review submissions or unresolved threads. Clean-source canonical verification passed. This is an agent self-review, not an independent GitHub approval. Issue 81 remains open for the documented external evidence.","unresolvedFindings":0,"squashTitle":"docs(publication): record production acceptance and access blockers (#129)","squashBody":"Refs #81"};
          assert.equal(conversationDigest(s),receipt.conversationDigest,'Reviewed conversation changed');
          writeFileSync('.generated/harness/pr81/review.json',JSON.stringify(receipt,null,2));
          NODE
          vp run harness delivery .generated/harness/pr81/github-snapshot.json pr .generated/harness/pr81/review.json > .generated/harness/pr81/delivery-assessment.json
          cat .generated/harness/pr81/delivery-assessment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/pr81/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
