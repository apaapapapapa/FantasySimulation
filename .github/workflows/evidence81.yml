name: Issue 81 delivery evidence
on:
  push:
    branches: [ops/81-acceptance-20260925]
    paths: [.github/workflows/evidence81.yml]
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e14c483f639304e910f00697d5102ad62b44961d
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for final PR CI and the requested review to settle
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 0
          script: |
            const assert = require('node:assert/strict');
            let settled = false;
            for (let i=0;i<48;i++) {
              const run=(await github.rest.actions.getWorkflowRun({owner:'apaapapapapa',repo:'FantasySimulation',run_id:36151834259})).data;
              assert.equal(run.head_sha,'e14c483f639304e910f00697d5102ad62b44961d');
              const review=(await github.rest.issues.getComment({owner:'apaapapapapa',repo:'FantasySimulation',comment_id:5834258524})).data;
              if(run.status==='completed' && !review.body.includes('**Running**')) {
                assert.equal(run.conclusion,'success');
                settled=true; break;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            assert.ok(settled,'CI or requested review did not settle within the observation budget');
            const pr=(await github.rest.pulls.get({owner:'apaapapapapa',repo:'FantasySimulation',pull_number:136})).data;
            assert.equal(pr.head.sha,'e14c483f639304e910f00697d5102ad62b44961d');
      - uses: ./.github/actions/setup-project
      - name: Collect PR 136 exact-head evidence with the existing read-only harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run harness github-snapshot apaapapapapa/FantasySimulation 136 .generated/harness/pr81-final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-final-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/pr81-final/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
