name: Delivery live probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.head_ref == 'feat/h1-delivery-evidence' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Collect a completed historical PR without approving it
        run: vp run harness github-snapshot apaapapapapa/FantasySimulation 13 .generated/harness/live-probe
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delivery-live-probe
          path: .generated/harness/live-probe/
          retention-days: 1
          if-no-files-found: error
