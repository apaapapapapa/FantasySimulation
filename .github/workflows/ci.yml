name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 20 * * 0'
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact baseline commit SHA for migration and paired load evidence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-policy:
    name: Dependency policy
    uses: ./.github/workflows/dependency-policy.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      simulation: ${{ steps.plan.outputs.simulation }}
      ui: ${{ steps.plan.outputs.ui }}
      load: ${{ steps.plan.outputs.load }}
      baseline: ${{ steps.plan.outputs.baseline }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - name: Plan verification from the exact tested tree
        id: plan
        shell: bash
        run: |
          mkdir -p .generated/harness/ci
          vp exec node scripts/ci/plan.ts .generated/harness/ci/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-plan
          path: .generated/harness/ci/plan.json
          if-no-files-found: error
          retention-days: 7
  docs:
    needs: changes
    if: needs.changes.outputs.full == 'false'
    name: Docs (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
          path: .generated/harness/ci
      - run: vp exec node scripts/ci/docs.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-docs-ubuntu-latest
          path: .generated/harness/docs/
          if-no-files-found: error
          retention-days: 7
  # Source tasks and the corpus observation start with the workflow instead of waiting for the
  # plan; they run for every PR and ci-gate/Verify bind them to the plan afterwards.
  tasks:
    name: Source (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [static, tests-1, tests-2, tests-3, tests-4, tests-5, tests-6, build]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Resolve the comparison baseline from the exact tested tree
        id: plan
        run: vp exec node scripts/ci/plan.ts "$RUNNER_TEMP/plan.json"
      - name: Run canonical verification task
        env:
          MIGRATION_BASE_SHA: ${{ steps.plan.outputs.baseline }}
          SOURCE_TASK: ${{ matrix.task }}
        run: vp exec node scripts/ci/verify.ts phase "$SOURCE_TASK"
      - name: Preserve executed task and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-task-${{ matrix.task }}
          path: .generated/harness/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
  ui:
    # Equivalent to plan.ui; ci-gate rejects any mismatch, so the browser jobs need not wait for it.
    # Each part is a separate runner; ci-gate recombines and rechecks their raw evidence.
    if: github.event_name != 'pull_request'
    name: UI (Linux ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        part: [interactive, static-chromium, static-webkit-1, static-webkit-2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ startsWith(matrix.part, 'static-webkit') && 'webkit' || 'chromium' }}
      - name: Run this part of the editor/battle, fault and static viewer browser suites
        run: vp exec node scripts/harness.ts ui .generated/harness/ui --part ${{ matrix.part }}
      - name: Preserve all attempts and failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-ui-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/ui/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
  corpus:
    name: Corpus (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Execute independent corpus repetitions while the tests run
        run: vp exec node scripts/ci/verify.ts phase corpus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-corpus
          path: .generated/harness/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
  load:
    needs: changes
    if: needs.changes.outputs.load == 'true'
    name: Paired load (ubuntu-latest, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          # The baseline worktree performs a second frozen install from the same content store.
          store: true
      - name: Compare assigned cases on one runner with five alternating pairs
        env:
          LOAD_BASE_SHA: ${{ needs.changes.outputs.baseline }}
          LOAD_SHARD: ${{ matrix.shard }}
        run: vp exec node scripts/harness.ts load "$LOAD_BASE_SHA" --shard "$LOAD_SHARD"
      - name: Preserve raw paired shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-load-${{ matrix.shard }}
          path: .generated/harness/load-shards/${{ matrix.shard }}/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
  ci-gate:
    name: ci-gate
    # The single aggregation point: it binds the task receipts and corpus observation itself, and
    # its log and artifact carry the Linux source report used by release, delivery and Issue completion.
    needs: [changes, tasks, corpus, load, docs, ui, security, dependency-policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
          path: .generated/harness/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.changes.outputs.full == 'true'
        with:
          pattern: harness-task-*
          path: .generated/harness/
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.changes.outputs.full == 'true'
        with:
          name: harness-corpus
          path: .generated/harness/
      - name: Verify complete source task and test coverage and bind the corpus observation
        if: always() && needs.changes.outputs.full == 'true'
        run: vp exec node scripts/ci/verify.ts aggregate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.changes.outputs.load == 'true'
        with:
          pattern: harness-load-*
          path: .generated/harness/ci/evidence/load
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.changes.outputs.full == 'false'
        with:
          name: harness-docs-ubuntu-latest
          path: .generated/harness/ci/evidence/docs-ubuntu-latest/docs
      - name: Collect security receipts from this run and attempt only
        # UI artifacts are deliberately separate from the temporary SQLite directory.
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: security-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/ci/security-evidence
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.changes.outputs.ui == 'true'
        with:
          pattern: harness-ui-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: .generated/harness/ci/evidence/ui
      - name: Bind every security receipt to the common report
        if: always()
        run: vp exec node scripts/security/evidence.ts
      - name: Require dependency policy
        if: always()
        shell: bash
        env:
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
        run: test "$DEPENDENCY_RESULT" = success
      - name: Bind expected jobs and evidence to the CI plan
        if: always()
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          export CI_RESULTS="$(node --input-type=module -e 'const x=JSON.parse(process.env.CI_RESULTS);console.log(JSON.stringify(Object.fromEntries(Object.entries(x).map(([k,v])=>[k,v.result]))))')"
          vp exec node scripts/ci/gate.ts
      - name: Preserve source and gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-ubuntu-latest
          path: .generated/harness/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
  release:
    name: Release
    needs: [ci-gate, security, dependency-policy]
    if: >-
      always() && !cancelled() &&
      needs['ci-gate'].result == 'success' &&
      needs.security.result == 'success' &&
      needs['dependency-policy'].result == 'success' &&
      github.repository == 'apaapapapapa/FantasySimulation' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Publish version tag and GitHub release
        run: vp exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
