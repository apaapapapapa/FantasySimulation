name: Delivery collector validation
on:
  push:
    branches: [test/h1-h2-collector-probe]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Collect actual PR and main CI evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/harness.ts github-snapshot apaapapapapa/FantasySimulation 32 .generated/harness/live-probe
      - name: Preserve read-only snapshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: delivery-collector-probe
          path: .generated/harness/live-probe
          include-hidden-files: true
          retention-days: 7
