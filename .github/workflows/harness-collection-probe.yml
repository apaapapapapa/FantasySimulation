name: Delivery collector validation
on:
  push:
    branches: [test/h1-h2-collector-probe]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Collect actual PR and main CI evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/harness.ts github-snapshot apaapapapapa/FantasySimulation 32 .generated/harness/live-probe
      - name: Assess authoritative CI plans without inventing review evidence
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {assessDelivery} from './scripts/harness/delivery.ts';
          const snapshot=JSON.parse(readFileSync('.generated/harness/live-probe/github-snapshot.json','utf8'));
          const result=assessDelivery(snapshot,'merge',null);
          console.log('FANTASY_LIVE_DELIVERY_REPORT='+JSON.stringify(result.report));
          for(const id of ['pr-ci','main-ci']) assert.equal(result.report.checks.find(c=>c.id===id)?.status,'pass',id);
          assert.equal(result.exitCode,2,'Missing review receipt must remain incomplete');
          NODE
      - name: Preserve read-only snapshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: delivery-collector-probe
          path: .generated/harness/live-probe
          include-hidden-files: true
          retention-days: 7
