name: PR210 publication review support
on:
  push:
    branches: [validation/pr210-publication-20260927]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Apply the reviewed fixes and collect diagnostics without credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr210-review"
          git rev-parse HEAD > "$RUNNER_TEMP/pr210-review/source-sha.txt"
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert old in text, path
              p.write_text(text.replace(old, new))
          p = Path('apps/api/src/artifacts.ts')
          p.write_text(p.read_text() + "export { currentMeasurements } from './measurements.ts';\n")
          edit('apps/cli/src/publication/publication-pool.ts', "from '@fantasy/api/tooling'", "from '@fantasy/api/artifacts'")
          path = 'apps/cli/src/publication/publication-writes.test.ts'
          edit(path, 'const gate = Promise.withResolvers<void>();', 'let release!: () => void;\n      const gate = new Promise<void>((resolve) => {\n        release = resolve;\n      });')
          edit(path, 'await gate.promise;', 'await gate;')
          edit(path, 'gate.resolve();', 'release();')
          edit('apps/api/src/replay/verification-pool.ts', '      if (result.attempted)', "      if (this.closed) throw new Error('Replay verification pool is closed');\n      if (result.attempted)")
          path = 'apps/api/src/replay/verification.test.ts'
          edit(path, 'expect(measurement.report().validation).toMatchObject({ calls: 1, failures: undefined });', 'expect(measurement.report().validation).toMatchObject({ calls: 1, uniqueReplays: 1, repeatedCalls: 0 });')
          edit(path, "await expect(pool.verify(directory, manifest, true)).rejects.toMatchObject({ code: 'DATA_INVALID' });", "await expect(measurement.run(() => pool.verify(directory, manifest, true))).rejects.toMatchObject({ code: 'DATA_INVALID' });")
          edit(path, '      await writeFile(path, original);\n      await pool.verify(directory, manifest, true);', '      expect(measurement.report().validation.replays[manifest.id]).toEqual({ calls: 2, failures: 1 });\n      await writeFile(path, original);\n      await measurement.run(() => pool.verify(directory, manifest, true));\n      expect(measurement.report().validation.replays[manifest.id]).toEqual({ calls: 3, failures: 1 });')
          edit(path, "it('rejects aborted and dead Workers rather than issuing verification success'", "it('rejects aborted and terminated in-flight Workers rather than issuing verification success'")
          edit(path, 'await expect(pool.verify(join(root, manifest.id), manifest, false)).rejects.toThrow();', 'await expect(pool.verify(join(root, manifest.id), manifest, false)).rejects.toThrow(/abort/i);')
          edit(path, '      await dead.pool.destroy();\n      await expect(dead.verify(join(root, manifest.id), manifest, false)).rejects.toThrow();', '      // Warm the real Worker, then terminate an admitted verification, not an idle pool.\n      await dead.verify(join(root, manifest.id), manifest, false);\n      const pending = dead.verify(join(root, manifest.id), manifest, false);\n      const rejected = expect(pending).rejects.toThrow(/terminat|closed|abort/i);\n      await dead.close();\n      await rejected;')
          PY
          set +e
          vp check --fix > "$RUNNER_TEMP/pr210-review/format.log" 2>&1
          echo $? > "$RUNNER_TEMP/pr210-review/format.exit"
          git restore -- scripts/quality/capabilities.ts
          node scripts/ci/verify.ts static > "$RUNNER_TEMP/pr210-review/static.log" 2>&1
          echo $? > "$RUNNER_TEMP/pr210-review/static.exit"
          vp test apps/api/src/replay/verification.test.ts apps/cli/src/publication/publication-export.test.ts apps/cli/src/publication/publication-writes.test.ts apps/cli/src/league/league-publication-performance.test.ts > "$RUNNER_TEMP/pr210-review/focused.log" 2>&1
          echo $? > "$RUNNER_TEMP/pr210-review/focused.exit"
          set -e
          git diff --binary > "$RUNNER_TEMP/pr210-review/format.patch"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/pr210-review/reviewed-source.tar.gz"
          if test -d .generated/harness/quality; then
            cp -R .generated/harness/quality "$RUNNER_TEMP/pr210-review/quality"
          fi
      - name: Store only unreferenced source blobs for explicit later review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const allowed = new Set([
            'apps/api/src/artifacts.ts', 'apps/api/src/batch/batch-check.ts',
            'apps/api/src/batch/battle-bundle.ts', 'apps/api/src/league/league-check.ts',
            'apps/api/src/replay/verification-pool.ts', 'apps/api/src/replay/verification-worker.ts',
            'apps/api/src/replay/verification.test.ts', 'apps/cli/src/league/league-cloud.test.ts',
            'apps/cli/src/league/league-cloud.ts', 'apps/cli/src/league/league-export.ts',
            'apps/cli/src/league/league-publication-performance.test.ts',
            'apps/cli/src/publication/publication-export.ts', 'apps/cli/src/publication/publication-files.ts',
            'apps/cli/src/publication/publication-graph.ts', 'apps/cli/src/publication/publication-pool.ts',
            'apps/cli/src/publication/publication-writes.test.ts'
          ]);
          const paths = execFileSync('git', ['diff', '--name-only', '-z']).toString().split('\0').filter(Boolean);
          if (paths.length !== allowed.size || paths.some(path => !allowed.has(path))) throw Error('Unexpected proposal files');
          const entries = [];
          for (const path of paths) {
            const data = readFileSync(path);
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex');
            const response = await fetch('https://api.github.com/repos/apaapapapapa/FantasySimulation/git/blobs', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' })
            });
            if (!response.ok) throw Error(`Blob staging failed: ${response.status}`);
            const result = await response.json();
            if (result.sha !== expected) throw Error('Unexpected blob identity');
            entries.push({ path, mode: '100644', type: 'blob', sha: result.sha });
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'pr210-review/blobs.json'), JSON.stringify(entries, null, 2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr210-review-support
          path: ${{ runner.temp }}/pr210-review
          if-no-files-found: error
          retention-days: 1
