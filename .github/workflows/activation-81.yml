name: Issue 81 activation evidence
on:
  push:
    branches: [ops/81-activation-20260925]
    paths: [.github/workflows/activation-81.yml]
permissions:
  contents: read
concurrency:
  group: issue-81-activation-evidence
  cancel-in-progress: false
jobs:
  retry-main:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 945c078b5c612a716cfdadfada942230819f4b6c
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Retry the full CI attempt once without changing code or gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {Octokit} from '@octokit/core';
          const api=new Octokit({auth:process.env.GH_TOKEN,request:{timeout:15000}});
          const common={owner:'apaapapapapa',repo:'FantasySimulation',run_id:36020330131};
          const run=(await api.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}',common)).data;
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1','Only one explicitly requested retry');
          assert.equal(run.head_sha,'945c078b5c612a716cfdadfada942230819f4b6c');
          assert.equal(run.event,'push');assert.equal(run.head_branch,'main');
          assert.equal(run.run_attempt,1);assert.equal(run.status,'completed');assert.equal(run.conclusion,'failure');
          await api.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun',common);
          console.log('MAIN_CI_RETRY='+JSON.stringify({runId:run.id,previousAttempt:run.run_attempt,reason:'CodeQL analysis/policy passed; GitHub SARIF upload returned HTTP 503. Full attempt is needed for the existing current-attempt security/UI evidence contract.',sourceSha:run.head_sha,requestedAt:new Date().toISOString()}));
          NODE
