name: Issue 81 activation evidence
on:
  push:
    branches: [ops/81-activation-20260925]
    paths: [.github/workflows/activation-81.yml]
permissions:
  contents: read
concurrency:
  group: issue-81-activation-evidence
  cancel-in-progress: false
jobs:
  main-evidence:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4618f3cc78942b354e1b8271f845f288cd4582c6
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Verify main-only environment, successful main CI and exact deployed viewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {Octokit} from '@octokit/core';
          import {setTimeout as pause} from 'node:timers/promises';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const api=new Octokit({auth:process.env.GH_TOKEN,request:{timeout:15000}});
          const common={owner:'apaapapapapa',repo:'FantasySimulation'};
          const target='4618f3cc78942b354e1b8271f845f288cd4582c6';
          const environment={...common,environment_name:'r2-publication'};
          const env=(await api.request('GET /repos/{owner}/{repo}/environments/{environment_name}',environment)).data;
          assert.equal(env.deployment_branch_policy?.custom_branch_policies,true);
          const policy=(await api.request('GET /repos/{owner}/{repo}/environments/{environment_name}/deployment-branch-policies',{...environment,per_page:100})).data;
          assert.equal(policy.total_count,1);
          assert.deepEqual(policy.branch_policies.map(p=>({name:p.name,type:p.type})),[{name:'main',type:'branch'}]);
          const directory='.generated/harness/activation-main';mkdirSync(directory,{recursive:true});
          const environmentRecord={name:env.name,policy:env.deployment_branch_policy,branches:policy.branch_policies.map(p=>({name:p.name,type:p.type})),checkedAt:new Date().toISOString()};
          writeFileSync(directory+'/environment.json',JSON.stringify(environmentRecord,null,2));
          console.log('PUBLICATION_ENVIRONMENT='+JSON.stringify(environmentRecord));
          const deadline=Date.now()+600000;
          let ci;
          do {
            ci=(await api.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}',{...common,run_id:36024584299})).data;
            assert.equal(ci.head_sha,target);assert.equal(ci.event,'push');assert.equal(ci.head_branch,'main');
            if(ci.status==='completed')break;
            console.log('MAIN_CI_STATUS='+JSON.stringify({status:ci.status,attempt:ci.run_attempt}));await pause(15000);
          }while(Date.now()<deadline);
          assert.equal(ci.status,'completed');assert.equal(ci.conclusion,'success','Main CI must pass');
          let build;
          do {
            const response=await fetch('https://apaapapapapa.github.io/FantasySimulation/build.json',{cache:'no-store',signal:AbortSignal.timeout(15000)});
            if(response.ok){build=await response.json();if(build.sourceSha===target)break;}
            console.log('VIEWER_STATUS=awaiting exact deployed source');await pause(15000);
          }while(Date.now()<deadline);
          assert.equal(build?.sourceSha,target,'Viewer must deploy the approved main SHA');
          writeFileSync(directory+'/viewer.json',JSON.stringify(build,null,2));
          console.log('MAIN_AND_VIEWER_VERIFIED='+JSON.stringify({sha:target,ciRun:ci.id,ciAttempt:ci.run_attempt,build}));
          NODE
      - name: Assess actual post-merge delivery with the same reviewed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vp run harness github-snapshot apaapapapapa/FantasySimulation 107 .generated/harness/107-merged
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {conversationDigest,assessDelivery} from './scripts/harness/delivery.ts';
          const directory='.generated/harness/107-merged/';
          const s=JSON.parse(readFileSync(directory+'github-snapshot.json','utf8'));
          const digest='9719766e7bf668db751d6b7c2bc4a6f2a137ccbd07fbee6d141b18730bde8575';
          assert.equal(conversationDigest(s),digest,'Reviewed discussion changed');
          assert.equal(s.pull.merge_commit_sha,'4618f3cc78942b354e1b8271f845f288cd4582c6');
          const receipt={candidateSha:'8e813dcb855f6395dc185e123824eaa2327d7ee0',conversationDigest:digest,reviewedPaths:['scripts/publication-workflow.test.ts'],completedAt:new Date().toISOString(),method:'self',summary:'Same complete agent review as passing pre-merge assessment in run 36024447369; unchanged digest rechecked. The tested one-file regex correction preserves all security gates. Post-merge main and deployed viewer are checked separately from production data activation.',unresolvedFindings:0,squashTitle:'test(publication): clarify artifact scope assertions for CodeQL (#107)',squashBody:'Refs #81'};
          const result=assessDelivery(s,'merge',receipt);
          writeFileSync(directory+'review.json',JSON.stringify(receipt,null,2));
          writeFileSync(directory+'delivery.json',JSON.stringify(result,null,2));
          console.log('MERGED_DELIVERY='+JSON.stringify(result));process.exitCode=result.exitCode;
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activation-107-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  dispatch-dry-run:
    needs: main-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4618f3cc78942b354e1b8271f845f288cd4582c6
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Explicitly dispatch the existing protected main workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {Octokit} from '@octokit/core';
          const api=new Octokit({auth:process.env.GH_TOKEN,request:{timeout:15000}});
          const common={owner:'apaapapapapa',repo:'FantasySimulation'};
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1','Do not redispatch by rerunning this broker');
          const branch=(await api.request('GET /repos/{owner}/{repo}/branches/{branch}',{...common,branch:'main'})).data;
          assert.equal(branch.commit.sha,'4618f3cc78942b354e1b8271f845f288cd4582c6');
          const inputs={ci_run_id:'36024584299',plan_input:'sample',mode:'dry-run'};
          await api.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',{...common,workflow_id:'publication.yml',ref:'main',inputs});
          console.log('PUBLICATION_DISPATCH='+JSON.stringify({sourceSha:branch.commit.sha,inputs,status:'requested',at:new Date().toISOString()}));
          NODE
