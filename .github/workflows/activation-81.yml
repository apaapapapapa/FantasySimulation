name: Issue 81 activation evidence
on:
  push:
    branches: [ops/81-activation-20260925]
    paths: [.github/workflows/activation-81.yml]
permissions:
  contents: read
concurrency:
  group: issue-81-activation-evidence
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8e813dcb855f6395dc185e123824eaa2327d7ee0
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Run canonical clean-source verification on the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = 8e813dcb855f6395dc185e123824eaa2327d7ee0
          env -u GITHUB_SHA -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH vp run harness source .generated/harness/107-source
          vp run harness report .generated/harness/107-source/report.json source-clean source-verify
      - name: Collect current PR discussion and delivery inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vp run harness github-snapshot apaapapapapa/FantasySimulation 107 .generated/harness/107-pr
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {conversationDigest} from './scripts/harness/delivery.ts';
          const s=JSON.parse(readFileSync('.generated/harness/107-pr/github-snapshot.json','utf8'));
          const review={candidate:s.pull.head.sha,base:s.pull.base.sha,digest:conversationDigest(s),reviewDecision:s.reviewDecision,files:s.files.map(f=>f.filename),comments:s.comments.map(c=>({id:c.id,body:c.body})),reviews:s.reviews.map(r=>({id:r.id,body:r.body,state:r.state,commit:r.commit_id})),errors:s.errors};
          writeFileSync('.generated/harness/107-review-input.json',JSON.stringify(review,null,2));
          console.log('PR107_REVIEW_INPUT='+JSON.stringify(review));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activation-107-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  extended-codeql:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8e813dcb855f6395dc185e123824eaa2327d7ee0
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/config.yml
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          output: ${{ runner.temp }}/107-codeql
          upload: never
          upload-database: false
          category: /language:javascript-typescript
      - name: Apply unchanged high-critical policy to independently analyzed candidate
        env:
          H4_REPORT_DIR: ${{ runner.temp }}/107-codeql-receipts
          GITHUB_SHA: 8e813dcb855f6395dc185e123824eaa2327d7ee0
        run: node scripts/security/codeql.ts "$RUNNER_TEMP/107-codeql"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activation-107-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/107-codeql-receipts/
          if-no-files-found: error
          retention-days: 7
