name: Issue 81 activation evidence
on:
  push:
    branches: [ops/81-activation-20260925]
    paths: [.github/workflows/activation-81.yml]
permissions:
  contents: read
concurrency:
  group: issue-81-activation-evidence
  cancel-in-progress: false
jobs:
  diagnose-codeql:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 945c078b5c612a716cfdadfada942230819f4b6c
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Retrieve exact uploaded findings and checked-out policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {Octokit} from '@octokit/core';
          import {mkdirSync,writeFileSync,readFileSync,existsSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const api=new Octokit({auth:process.env.GH_TOKEN,request:{timeout:15000}});
          const common={owner:'apaapapapapa',repo:'FantasySimulation'};
          const target='945c078b5c612a716cfdadfada942230819f4b6c';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),target);
          const dir='.generated/harness/codeql-diagnostic';mkdirSync(dir,{recursive:true});
          const source=['scripts/security/codeql.ts','scripts/security/codeql-policy.ts','.github/workflows/security.yml'].map(path=>({path,blob:existsSync(path)?execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim():null,content:existsSync(path)?readFileSync(path,'utf8'):null}));
          writeFileSync(dir+'/sources.json',JSON.stringify(source,null,2));
          console.log('ACTUAL_CODEQL_SOURCE='+JSON.stringify(source));
          const analyses=(await api.request('GET /repos/{owner}/{repo}/code-scanning/analyses',{...common,ref:'refs/heads/main',sarif_id:'de4f98b9-d535-48d5-a15d-59c6ac908ec3',per_page:100})).data;
          assert(analyses.length>0&&analyses.length<100,'Expected exact uploaded analysis');
          const findings=[];
          for(const a of analyses){
            assert.equal(a.commit_sha,target);
            const sarif=(await api.request('GET /repos/{owner}/{repo}/code-scanning/analyses/{analysis_id}',{...common,analysis_id:a.id,headers:{accept:'application/sarif+json'}})).data;
            writeFileSync(`${dir}/analysis-${a.id}.json`,JSON.stringify(sarif,null,2));
            for(const run of sarif.runs??[])for(const result of run.results??[]){
              const rule=(run.tool.driver.rules??[]).find(r=>r.id===result.ruleId);
              findings.push({analysisId:a.id,commit:a.commit_sha,ruleId:result.ruleId,level:result.level,message:result.message,rule:rule?{name:rule.name,description:rule.shortDescription,properties:rule.properties}:null,locations:result.locations,properties:result.properties,codeFlows:result.codeFlows});
            }
          }
          writeFileSync(dir+'/findings.json',JSON.stringify(findings,null,2));
          console.log('EXACT_CODEQL_FINDINGS='+JSON.stringify(findings));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activation-81-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/codeql-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
