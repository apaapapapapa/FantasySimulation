name: Issue 81 activation evidence
on:
  push:
    branches: [ops/81-activation-20260925]
    paths: [.github/workflows/activation-81.yml]
permissions:
  contents: read
concurrency:
  group: issue-81-activation-evidence
  cancel-in-progress: false
jobs:
  diagnose-codeql:
    if: github.repository == 'apaapapapapa/FantasySimulation' && github.actor == 'apaapapapapa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 945c078b5c612a716cfdadfada942230819f4b6c
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Read alerts and exact source without dismissing or suppressing findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {Octokit} from '@octokit/core';
          import {mkdirSync,writeFileSync,readFileSync,existsSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const api=new Octokit({auth:process.env.GH_TOKEN,request:{timeout:15000}});
          const common={owner:'apaapapapapa',repo:'FantasySimulation'};
          const target='945c078b5c612a716cfdadfada942230819f4b6c';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),target);
          const dir='.generated/harness/codeql-alerts';mkdirSync(dir,{recursive:true});
          const alerts=(await api.request('GET /repos/{owner}/{repo}/code-scanning/alerts',{...common,ref:'refs/heads/main',per_page:100})).data;
          assert(alerts.length<100,'Alert pagination exceeds diagnostic budget');
          writeFileSync(dir+'/alerts.json',JSON.stringify(alerts,null,2));
          const detailed=[];
          for(const a of alerts){
            const instances=(await api.request('GET /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/instances',{...common,alert_number:a.number,ref:'refs/heads/main',per_page:100})).data;
            for(const i of instances){
              const uri=i.location?.path;
              const safe=typeof uri==='string'&&/^[a-zA-Z0-9_.\/-]+$/.test(uri)&&!uri.startsWith('/')&&!uri.split('/').includes('..');
              const source=safe&&existsSync(uri)?readFileSync(uri,'utf8'):null;
              if(source)writeFileSync(dir+'/'+uri.replaceAll('/','__'),source);
              detailed.push({number:a.number,state:a.state,rule:a.rule,instance:i,source,blob:source?execFileSync('git',['hash-object',uri],{encoding:'utf8'}).trim():null});
            }
          }
          writeFileSync(dir+'/details.json',JSON.stringify(detailed,null,2));
          console.log('CURRENT_MAIN_CODEQL_ALERTS='+JSON.stringify(detailed));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: activation-81-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/harness/codeql-alerts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
