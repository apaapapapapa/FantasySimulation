# Temporary development transport; remove before this PR is ready for review.
name: Issue 45 workspace
on:
  pull_request:
    paths: ['.github/workflows/issue-45-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'work/issue-45-rational-candidates' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - name: Package resolved pinned Node runtime
        shell: bash
        run: |
          mkdir -p /tmp/issue-45-node
          cp "$(node -p process.execPath)" /tmp/issue-45-node/node
          node --version > /tmp/issue-45-node/version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-45-node
          path: /tmp/issue-45-node/
          retention-days: 1
          if-no-files-found: error
