name: Pinned Chromium and WebKit
description: Browser-only cache, exact Playwright/OS/architecture identity; no test results
runs:
  using: composite
  steps:
    - name: Read the locked Playwright version
      id: version
      shell: bash
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      id: browser
      with:
        path: .generated/playwright
        key: fantasy-chromium-webkit-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}
    - name: Install browser libraries and exact Chromium and WebKit
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: .generated/playwright
      run: vp exec playwright install --with-deps chromium webkit --only-shell
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.browser.outputs.cache-hit != 'true'
      with:
        path: .generated/playwright
        key: ${{ steps.browser.outputs.cache-primary-key }}
