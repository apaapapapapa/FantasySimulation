name: Verify Pages source
description: Fresh exact-attempt main CI and repository checks before build or deployment
inputs:
  run-id:
    required: false
    description: Completed CI run ID
  league-phase:
    default: ''
    description: Optional league start or finish; start resolves the current SHA CI when run-id is empty
outputs:
  sha:
    description: Verified source SHA
    value: ${{ steps.gate.outputs.sha }}
  run-id:
    description: Verified CI run ID
    value: ${{ steps.gate.outputs.run-id }}
runs:
  using: composite
  steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: gate
      env:
        CI_RUN_ID: ${{ inputs.run-id }}
        LEAGUE_PHASE: ${{ inputs.league-phase }}
      with:
        script: |
          const { pagesSource, leagueSource } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-policy.ts`);
          const repo = {owner: context.repo.owner, repo: context.repo.repo};
          const phase = process.env.LEAGUE_PHASE;
          let run_id = Number(process.env.CI_RUN_ID);
          if (!run_id && phase === 'start') {
            const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'ci.yml', event: 'push', branch: 'main', head_sha: context.sha, per_page: 1});
            run_id = data.workflow_runs[0]?.id;
          }
          if (!Number.isSafeInteger(run_id) || run_id < 1) throw new Error('Invalid CI run');
          const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id});
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {...repo, run_id, attempt_number: run.run_attempt, per_page: 100});
          const {data: main} = await github.rest.repos.getBranch({...repo, branch: 'main'});
          const manual = phase === 'finish' || (!phase && context.eventName === 'workflow_dispatch');
          const comparison = manual ? (await github.rest.repos.compareCommits({...repo, base: run.head_sha, head: main.commit.sha})).data.status : 'identical';
          const sha = phase ? leagueSource(run, jobs, main.commit.sha, context.sha, phase, comparison) : pagesSource(run, jobs, main.commit.sha, manual, comparison);
          core.setOutput('sha', sha);
          core.setOutput('run-id', run_id);
