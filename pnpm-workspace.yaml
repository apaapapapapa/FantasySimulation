packages:
  - apps/*
  - packages/*

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  # Miniflare pins the vulnerable patch; keep its runtime on the patched 7.x API.
  # GHSA-rfgv-xxqx-mfg5 / GHSA-w293-vg96-wgc3; remove when Miniflare updates its pin.
  miniflare@5.20260921.0-alpha>undici: 7.29.1

# The official Vite+ alias uses 0.3.3 while exposing the Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: 0.3.3

allowBuilds:
  # Required by the pinned Drizzle SQLite driver; other new scripts remain denied.
  better-sqlite3: true
  esbuild: true
  vite-plus: true
  # Wrangler's pinned local runtime; used only by explicit administrator deployment.
  workerd: true

# Fiber 9.8 is the first release whose peer range includes the existing React 19.3 pin.
# Explicitly reviewed exact renderer version; other new packages keep the age gate.
minimumReleaseAgeExclude:
  - '@react-three/fiber@9.8.0'

patchedDependencies:
  # GHSA-vfj7-8cjw-p6xm: bounded parsing and AST traversal (MIT upstream PR #72).
  # https://github.com/micromatch/braces/pull/72 at 28d440b5dd449dbf1fe6f3506cf94ecca4d02660.
  # Runtime-only backport of the unmerged proposal; no package/version rename.
  # Keep audit findings visible until an official fixed release replaces this patch.
  braces@3.0.3: patches/braces@3.0.3.patch
