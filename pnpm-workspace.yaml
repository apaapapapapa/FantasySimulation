packages:
  - apps/*
  - packages/*

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  # GHSA-xjj6-f33q-929c / GHSA-4w7w-5xrc-9h26 / GHSA-2m5v-pch6-74hx / GHSA-qrxm-fqhp-jwvm:
  # Miniflare pins undici 7.29.1; remove when Miniflare updates its pin.
  miniflare@5.20261006.1-alpha>undici: 7.30.1
  # GHSA-67mh-4wv8-2f99: run the legacy Drizzle loader on a patched esbuild; its transforms and
  # dev-server origin checks are exercised by scripts/security/esbuild.test.ts.
  # Remove when core-utils drops its vulnerable 0.18 pin or Drizzle drops the loader.
  '@esbuild-kit/core-utils@3.3.2>esbuild': 0.28.2

# The official Vite+ alias uses 1.4.0 while exposing the Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0

allowBuilds:
  # Required by the pinned Drizzle SQLite driver; other new scripts remain denied.
  better-sqlite3: true
  esbuild: true
  vite-plus: true
  # Wrangler's pinned local runtime; used only by explicit administrator deployment.
  workerd: true

# Fiber 9.8 is the first release whose peer range includes the existing React 19.3 pin.
# Explicitly reviewed exact renderer version; other new packages keep the age gate.
minimumReleaseAgeExclude:
  - '@react-three/fiber@9.8.0'

patchedDependencies:
  # GHSA-vfj7-8cjw-p6xm: bounded parsing and AST traversal (MIT upstream PR #72).
  # https://github.com/micromatch/braces/pull/72 at 28d440b5dd449dbf1fe6f3506cf94ecca4d02660.
  # Runtime-only backport of the unmerged proposal; no package/version rename.
  # Audit retains the raw finding; recognition requires verified bytes and regression execution.
  braces@3.0.3: patches/braces@3.0.3.patch
