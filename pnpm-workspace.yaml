packages:
  - apps/*
  - packages/*

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11

# The official Vite+ alias uses 0.3.3 while exposing the Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: 0.3.3

allowBuilds:
  # Required by the pinned Drizzle SQLite driver; other new scripts remain denied.
  better-sqlite3: true
  esbuild: true
  vite-plus: true
  # Wrangler's pinned local runtime; used only by explicit administrator deployment.
  workerd: true

# Fiber 9.8 is the first release whose peer range includes the existing React 19.3 pin.
# Explicitly reviewed exact renderer version; other new packages keep the age gate.
minimumReleaseAgeExclude:
  - '@react-three/fiber@9.8.0'
